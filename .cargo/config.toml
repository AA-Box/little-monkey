# Workaround for a documented getrandom 0.3+/0.4+ Windows issue: by default
# getrandom imports `ProcessPrng` from `bcryptprimitives.dll` (raw-dylib).
# On some Windows environments — confirmed here via a GitHub Actions
# windows-latest CI run — that import isn't resolvable at process start,
# crashing the whole binary immediately with STATUS_ENTRYPOINT_NOT_FOUND
# (0xc0000139), before any code (including any test) ever runs. This is a
# known class of issue (see rust-random/getrandom's own `windows_legacy`
# backend, added specifically for this). `windows_legacy` falls back to the
# older `RtlGenRandom` import (advapi32.dll), the same API every getrandom
# release before 0.3 used, and the same one this crate's *other* resolved
# getrandom version (0.2.x, pulled in only by `ring`) already uses — so this
# also removes a second, unrelated source of Windows import-table
# fragmentation between the two coexisting getrandom major versions.
# Scoped to Windows only; macOS/Linux are unaffected and keep each
# platform's own default backend.
[target.'cfg(target_os = "windows")']
rustflags = ['--cfg', 'getrandom_backend="windows_legacy"']
