[workspace]
members = [
  "rust",
  "examples/simple-tool",
  "examples/mock-channel",
  "examples/mock-stt-provider",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
little-monkey-extension-sdk = { path = "rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "=0.60.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
