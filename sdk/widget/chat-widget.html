<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Little Monkey chat widget — demo host page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <h1>Your site</h1>
    <p>
      This page demonstrates embedding the Little Monkey chat widget. Replace
      <code>baseUrl</code> and <code>token</code> below with the values shown
      in Settings &gt; API Server &gt; Widget, then open this file directly in
      a browser (or serve it from your own site) while the API server is
      running.
    </p>

    <!--
      Configure the widget before loading chat-widget.js. Keep this token
      scoped to `chat` only (and ideally a single backend) — this file will
      likely end up on a page other people can view source on.
    -->
    <script>
      window.LMK_CHAT_WIDGET_CONFIG = {
        baseUrl: "http://127.0.0.1:1234/v1",
        token: "lmk-REPLACE-ME",
        model: "qwen2.5-7b-instruct",
        title: "Ask the homelab",
        // systemPrompt: "You are a helpful assistant for this internal site.",
      };
    </script>
    <script src="./chat-widget.js"></script>
  </body>
</html>
