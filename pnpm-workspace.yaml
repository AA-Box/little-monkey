packages:
  - .

allowBuilds:
  esbuild: true

# @xmldom/xmldom reaches us three levels down, under plist -> tauri-liquid-icon,
# so nothing we declare directly can move it. 0.9.12 clears ten open advisories
# against 0.9.10; drop this override once tauri-liquid-icon ships a plist that
# resolves 0.9.12 or later on its own.
overrides:
  '@xmldom/xmldom': ^0.9.12
  # browserslist sits under @babel/core, which asks for '>= 4.21.0' and so keeps
  # whatever the lockfile already pinned. 4.28.7 fixes GHSA-73wf-gq98-2v4g and
  # pulls a baseline-browser-mapping past GHSA-w5vr-8v7q-w6rv with it.
  browserslist: ^4.28.9
