[package]
name = "little-monkey"
version = "1.7.1"
description = "Little Monkey — a local model runner with agentic file/shell tools"
authors = ["you"]
license = "MIT"
edition = "2021"
default-run = "little-monkey"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "little_monkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The macOS iMessage helper. A separate process on purpose: Full Disk Access
# and Automation for Messages.app are permissions the *daemon* must never hold,
# so the code that needs them lives here and talks JSON-RPC over its own stdio.
# The operator installs and points an account at it; nothing downloads or
# launches it behind their back.
#
# Declared explicitly rather than discovered under `src/bin/` so the name the
# operator types matches the product. It compiles on every platform and refuses
# to run anywhere but macOS — see its `main`.
[[bin]]
name = "little-monkey-imessage-helper"
path = "src/imessage_helper/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10.9"
cc = "1"

[dependencies]
# "unstable" enables the multiwebview API (Window::add_child + Manager::
# get_window), the mechanism behind browser_pane.rs's real in-app browser
# tabs — each tab is a native child webview overlaid on the main webview.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
# In-app updates (docs/auto-update.md): background check against the signed
# `latest.json` published by the release workflow, silent download+install on
# macOS/Linux, and a "Relaunch to update" card. With an empty
# `plugins.updater.pubkey` every check fails signature verification and the
# frontend swallows it, so an unconfigured build behaves as if updates didn't
# exist.
tauri-plugin-updater = "2.10.1"
# Only used for `relaunch()` after an update installs — the second half of the
# "Relaunch to update" click. Separate crate from the updater itself.
tauri-plugin-process = "2.3.1"
# hosted_oauth.rs: receives the littlemonkey:// deep link Cloudflare Worker
# redirects to after a Slack/Google OAuth exchange (see
# Cargo.toml's own `reqwest`/`rmcp` comments for why the *loopback* OAuth
# flow in mcp_oauth.rs can't serve providers that require a client_secret).
tauri-plugin-deep-link = "2"
# Required pairing per tauri-plugin-deep-link's own docs: without this, an OS
# deep-link launch on Windows/Linux while the app is already running spawns a
# second process instead of routing the URL into the existing one. Must be
# registered first in the plugin chain (see lib.rs).
tauri-plugin-single-instance = "2"
tokio = { version = "1.52.3", features = ["full"] }
zbus = "5.17.0"
# "form" added for web.rs's `tool_web_search`: reqwest 0.13 feature-gates
# `RequestBuilder::form` (unlike earlier 0.11/0.12 examples elsewhere), needed
# to POST the DuckDuckGo query as `application/x-www-form-urlencoded`.
# "query" added in phase 3 for the same reason: `RequestBuilder::query` (used
# by the Brave/SearXNG branches to attach `?q=&count=`/`?q=&format=json`) is
# also feature-gated in reqwest 0.13, separately from "form".
reqwest = { version = "0.13.4", features = ["json", "stream", "form", "query", "multipart"] }
futures-util = "0.3.32"
uuid = { version = "1.23.4", features = ["v4"] }
regex = "1.12.4"
walkdir = "2.5.0"
unicode-normalization = "0.1"
globset = "0.4"
dirs = "6.0.0"
# Platform keystore features are required: without them keyring v3 falls back
# to its in-memory mock store, where every `Entry::new` is an independent
# credential — keys "save" but can never be read back (has_key stays false).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
rustyline = "17"
# monkey-cli's `launcher.rs` only — raw mode plus key events for the bare
# `monkey` menu/model picker. rustyline (the REPL's line editor) has no
# single-key API, and a full TUI framework would be a lot of crate for two
# scrolling lists.
crossterm = "0.29"
# mcp_oauth.rs: implementing rmcp's `transport::auth::CredentialStore`/
# `StateStore` traits (both `#[async_trait]`-defined) requires applying the
# same macro to the `impl` block. Already an indirect dependency via rmcp
# itself (whose `auth` feature needs it); made direct so this crate's own
# code can name the macro. Version-matched to rmcp's own requirement so only
# one copy resolves.
async-trait = "0.1.89"
# "auth" (+ its required "reqwest" feature, for the rustls-backed
# `ReqwestClient`/TLS provider `oauth2`'s HTTP calls need) enables rmcp's
# `transport::auth` module — generic MCP-spec OAuth 2.0 client support (RFC
# 8414 discovery, RFC 7591 dynamic client registration, PKCE authorization
# code flow, token refresh) used by `mcp_oauth.rs`. See that module's doc
# comment for how it composes with the existing manual-bearer-token path.
rmcp = { version = "2.2.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
# Only needed by the `mcp_test_server` bin (src/bin/mcp_test_server.rs), a
# trivial stdio MCP server used solely by mcp.rs's unit tests — its
# `#[tool_router]`-annotated methods need `JsonSchema` derives, and that
# derive macro resolves the `schemars` crate path directly (not via rmcp's
# re-export), so it must be a direct dependency here too. Version-matched to
# rmcp's own `schemars = "1.0"` requirement so only one copy resolves.
schemars = "1"
# Only needed by the `mcp_test_server` bin, same reasoning as `schemars`
# above: its `wait_for_cancel` test tool (used by mcp.rs's cancellation-
# propagation test) takes a `tokio_util::sync::CancellationToken` argument,
# rmcp's own server-side extractor type for "cancelled when this request's
# `notifications/cancelled` arrives" — rmcp depends on tokio-util itself but
# doesn't re-export it. Version-matched to the copy already in Cargo.lock via
# rmcp's own dependency so only one copy resolves.
tokio-util = "0.7"
# Built-in, zero-configuration local speech transcription. The pinned fork
# carries the Windows ARM64 MSVC/Clang fixes missing from archived upstream.
whisper-rs = { git = "https://github.com/screenpipe/whisper-rs", rev = "97e40705033724dee601e89f3bd701af8096c846", default-features = false }
# Symphonia demuxes/decodes WAV/MP3/AAC/FLAC/etc. WebM/Opus is demuxed by
# Symphonia and decoded by opus-decoder because Symphonia intentionally has
# no Opus decoder. Both are pure Rust and ship inside the application.
symphonia = { version = "0.6.1", features = ["all"] }
opus-decoder = "0.1.1"
# web.rs: HTML->Markdown conversion for tool_web_fetch (turndown.js-style,
# html5ever-based). The design doc named ~0.2; 0.5 is current on crates.io as
# of implementation time — API used here (the free `convert` fn) is stable
# across that range.
htmd = "0.5"
# web.rs: explicit dependency (was already a transitive reqwest dep) so
# `validate_fetch_url`'s SSRF guard can parse/inspect the URL's host without
# relying on reqwest's internals.
url = "2"
# web.rs: CSS-selector HTML parsing for the DuckDuckGo results page
# (tool_web_search, phase 2). The design doc named ~0.24; 0.27 is current on
# crates.io as of implementation time — the `Html::parse_document` /
# `Selector::parse` / `ElementRef::text`/`.attr()` API used here is stable
# across that range. Default features (html5ever-based parsing) are enough;
# no need for the `serde` cargo feature since results are re-serialized into
# our own `SearchResult` struct.
scraper = "0.27"
# web.rs: Mozilla-readability-style article extraction, run on HTML pages
# before htmd conversion (tool_web_fetch, phase 5 polish — see
# `extract_readable_content`). The design doc named ~0.6 (dated 2026-07-10);
# 0.18.0 is current on crates.io as of implementation time — a much larger
# jump than htmd/scraper's own doc-vs-actual deltas, but the API surface used
# here (`Readability::new(html, document_url, config) -> Result<Self, _>`,
# `.parse() -> Result<Article, _>`, `Article::{title, content, length}`)
# matches the design doc's description; verified against docs.rs at
# implementation time rather than assumed from the stale version number.
dom_smoothie = "0.18.0"
# server.rs (local OpenAI-compatible API server, phase 1): the design doc
# named hyper/hyper-util/http-body-util/sha2/rand as already-transitive deps
# (pulled in via reqwest/tauri/keyring) as of its 2026-07-10 Cargo.lock
# snapshot — verified still true for hyper/hyper-util/http-body-util/sha2 via
# `cargo tree -i` against the *current* lockfile (versions below match
# exactly). `rand` is the one exception: `cargo tree -i rand`/`-i quinn-proto`
# print nothing against this lockfile — `rand 0.10.2` is listed in Cargo.lock
# only as reqwest's optional (never-enabled) `http3`/quinn dependency chain,
# not as a package actually compiled into this build. Adding it here as a
# direct dependency (pinned to the exact version already recorded in
# Cargo.lock) is therefore a small real addition to the build graph, not the
# "zero new downloads" the design doc claimed — the only such deviation among
# the five crates it named.
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.3"
sha2 = "0.10.9"
# model_sources.rs: Git blob object ids, which is how Hugging Face content
# addresses the small files of a model repository that are not in LFS. Already
# in the dependency tree; named here so it can be used directly.
sha1 = "0.10.7"
rand = "0.10.2"
# connectors.rs: hand-rolled AWS Signature Version 4 for `connectors_add_s3`'s
# bucket-existence verification `HEAD` call — no AWS SDK dependency, just the
# one keyed-hash primitive SigV4 needs on top of the `sha2` already above.
hmac = "0.12"
# knowledge_service.rs: real filesystem watcher backing the `WatchedFolder`
# Knowledge Sync connector (distinct from the manual, pull-only
# `LocalFolder`). Small, no GPU/OS-input-hook surface — just OS filesystem
# change notifications.
notify = "8"
# portability_commands.rs: AES-256-GCM authenticated snapshot encryption.
# ring 0.17.14 is already in the locked/compiled dependency graph through
# rustls; making it direct lets the backup layer use its audited AEAD API
# without a second crypto implementation or another downloaded crate.
ring = "0.17.14"
# daemon/remote: the optional user-owned remote runner terminates TLS itself
# when exposed directly. These exact versions are already present through
# reqwest, so this only makes the server-side API available to the binary.
tokio-rustls = "0.26.4"
rustls = "0.23.41"
# daemon/adapters: Discord's gateway, Slack's Socket Mode and Mattermost's event
# socket are all plain WebSocket over TLS, so one client covers three providers.
# Pinned to the rustls backend already resolved above rather than pulling a
# second TLS stack in behind it.
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# daemon/adapters/irc.rs: `tokio_rustls` (above) verifies a TLS certificate
# against whatever root store it is handed, but ships with none itself — the
# IRC adapter opens a raw client TLS socket outside of `reqwest`/tungstenite,
# so it needs its own root store rather than borrowing theirs. Pinned to
# 0.26.11, the exact version already resolved by `tokio-tungstenite`'s own
# `rustls-tls-webpki-roots` feature above, so this adds no new resolution.
webpki-roots = "0.26"
# daemon/adapters/email.rs: the operator's own mailbox, over IMAP in and SMTP
# out. All three are pure parsing and protocol crates with no TLS of their own —
# the socket handed to them is the `tokio_rustls` client stream irc.rs already
# proves out, so no second TLS stack resolves.
#
# `async-imap` reads IMAP responses: literals (`{1234}`), continuation lines
# and untagged replies interleaved with tagged ones are exactly where a
# hand-rolled reader silently truncates somebody's mail. Pinned to the tokio
# runtime rather than its default `async-std`, so the daemon keeps one
# executor.
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
# `mail-parser` decodes inbound RFC 5322/2045: typed `Message-ID`/`In-Reply-To`
# /`References` (which is what the reply-threading contract is written
# against), RFC 2047 encoded words, quoted-printable and base64 transfer
# encodings, nested multiparts and per-part decoded sizes.
mail-parser = { version = "0.11.8", default-features = false }
# `mail-builder` writes the outbound side of the same RFCs. Default features
# off on purpose: the only one is `gethostname`, which would put this machine's
# hostname into a generated Message-ID; the adapter mints its own from the
# account's `from_address` domain instead.
mail-builder = { version = "0.5.0", default-features = false }
# knowledge_adapters.rs: bounded, inert Office Open XML extraction. These are
# already locked transitively in this workspace; making them direct lets the
# app decode ZIP/Deflate containers and stream XML without executing macros,
# formulas, scripts, or external relationships.
flate2 = "1.1.9"
quick-xml = "0.41.0"
crc32fast = "1.5.0"
# stacks.rs (RAG design doc, slice 4): pure-Rust PDF text extraction for
# Knowledge Stacks sources. `optional = true` + the `pdf-extraction` feature
# below (default-on) so PDF support is a build-time toggle, not a hard
# dependency baked unconditionally into every build — a build run with
# `--no-default-features` (or a future leaner CLI-only profile) simply skips
# `.pdf` sources at index time, the same as any other unsupported extension.
# 0.12.0 verified current on crates.io (`cargo add pdf-extract --dry-run`) at
# implementation time; the design doc didn't pin a version.
pdf-extract = { version = "0.12", optional = true }
# recipes.rs: YAML recipe parsing (docs/roadmap/p3-scheduled-automation.md).
# serde_yaml has been deprecated since March 2024 (see
# https://users.rust-lang.org/t/serde-yaml-deprecation-alternatives/108868);
# serde-saphyr is the maintained, pure-Rust successor for typed
# `from_str::<T>` deserialization, exactly this use case. 0.0.29 verified
# current on crates.io (`cargo add serde-saphyr --dry-run`) at implementation
# time.
serde-saphyr = "0.0.29"
# automations.rs: cron expression validation/next-run computation for the
# in-app scheduler (design doc slice 3). Actively maintained, POSIX weekday
# numbering, timezone-aware, seconds-optional — preferred over the older
# `cron` crate, which uses Quartz (1-7 = Sun-Sat shifted) weekday numbering
# that would silently mismatch user expectations. 3.0.1 verified current on
# crates.io (`cargo add croner --dry-run`) at implementation time. Kept
# Rust-side only (no frontend cron dependency) so `cron_validate`/`cron_next`
# are the only new date-parsing surface this feature adds.
croner = "3.0.1"
chrono = { version = "0.4.45", features = ["serde"] }
# system.rs: cross-platform physical-memory snapshot used only to decide
# whether multiple local comparison branches should launch concurrently or
# be queued. The crate exposes byte counts on macOS, Windows, and Linux.
system-memory = "0.1.7"
# run_ledger.rs / storage.rs: one bundled, cross-platform SQLite engine for
# ordered run events, approvals, migrations, FTS5 history, and verified
# backup/restore. Bundling avoids depending on whatever SQLite version happens
# to be installed on a user's machine; backup/limits support bounded portable
# snapshots and hostile-input guardrails.
# Held at 0.37 by `matrix-sdk-sqlite`, not by anything in this tree.
# `libsqlite3-sys` declares `links = "sqlite3"`, so exactly one version of it
# may exist in a binary: the Matrix crypto store's rusqlite and ours have to
# be the same. Bumping this without upstream bumping theirs fails at
# resolution, loudly, which is the failure mode we want. When
# `matrix-sdk-sqlite` moves to a newer rusqlite, move with it — nothing here
# depends on 0.37 specifically.
rusqlite = { version = "0.37", features = ["bundled", "backup", "limits"] }
# terminal.rs: one cross-platform pseudoterminal implementation for the
# in-app terminal. The frontend intentionally stays a thin line-oriented
# terminal surface; process ownership, output bounds, cancellation, and
# workspace validation all remain in Rust.
portable-pty = "0.9.0"
enigo = "0.6.1"
# Matrix. The whole client — sync, room state, media, threads, and the Olm /
# Megolm lifecycle — comes from the maintained SDK rather than from hand-built
# Client-Server requests. `adapters/matrix.rs` owns only normalization into
# `ChannelEnvelope` and the fail-closed rules around encryption.
#
# `e2e-encryption` is what makes an encrypted room work at all; `sqlite` is
# what makes it survive a restart, by persisting the crypto store *and* the
# session under the daemon's own private state directory. Without persistence
# every restart would register a new device against the user's account.
#
# Two known costs, both compile-time loud: the SDK's `matrix-sdk-sqlite` is
# what holds `rusqlite` at 0.37 above, and `matrix-sdk-base` pulls `decancer`,
# whose `impl Add<_> for String` makes `String + &String` ambiguous tree-wide
# (write `format!` instead). Its HTTP is this tree's own `egress::hardened()`
# client, handed to `ClientBuilder::http_client`, so no Matrix request escapes
# the egress guard.
#
# Ruma types are reached through `matrix_sdk::ruma` rather than a second direct
# `ruma` dependency, so this tree cannot compile against a different feature
# set from the one the SDK itself was built with.
matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption", "sqlite"] }
# `mime::Mime` is the type `Room::send_attachment` takes for a file's content
# type. Already in the tree via reqwest/matrix-sdk; named here because this is
# the one place our own code constructs one.
mime = "0.3"
# Executable extensions are WebAssembly components only. Keep Wasmtime's
# optional surface narrow: no cache/profiling/debug-server/native plugin path,
# and Preview 2 is the sole WASI ABI linked into extension stores.
wasmtime = { version = "=47.0.4", default-features = false, features = ["async", "cranelift", "component-model", "runtime", "std"] }
wasmtime-wasi = { version = "=47.0.4", default-features = false, features = ["p2"] }

# model_sources.rs: advisory cross-process install locks on macOS/Linux keep
# desktop and CLI pulls from mutating the same resumable partial download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# mlx_runtime.rs only. tar 0.4.46 is already locked and compiled through
# tauri-plugin-updater, which unpacks macOS update archives with it. Making it
# direct lets mlx_runtime.rs unpack the MLX service package the component hub
# downloads, without adding a crate to the graph. macOS-scoped because
# `mlx_runtime` itself is: the Windows and Linux builds have no MLX package to
# unpack, so they should not carry an archive parser for one. Entries are read as
# data only: the extractor takes bytes and a validated relative path from each
# header and applies its own modes, so no permission, symlink, or device entry in
# an archive is ever honored.
[target.'cfg(target_os = "macos")'.dependencies]
tar = "0.4.46"

# sandbox_linux.rs: the Linux half of the sandbox's OS boundary (ROADMAP.md item
# K3). `landlock` rather than raw `landlock_create_ruleset`/`landlock_add_rule`/
# `landlock_restrict_self` because it is a safe wrapper maintained by the
# Landlock author, and because it carries the ABI compatibility engine that keeps
# a ruleset naming a v3 access right from being rejected outright by a v1 kernel.
# `seccompiler` (Firecracker's, via rust-vmm) for the network-denial filter: the
# BPF assembly for an argument comparison on `socket(2)`'s address family is
# exactly the kind of code not to hand-roll on a security boundary. 0.4.7/0.5.0
# verified current on crates.io at implementation time.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"

# cli_install.rs (Windows only — macOS/Linux use a plain symlink via
# `std::os::unix::fs::symlink`, no extra dependency needed): adds the CLI
# shim directory to `HKCU\Environment\Path` on first launch, user-scope
# only, no admin elevation. 0.56 verified current on crates.io at
# implementation time.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Media_Speech", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# cli_install.rs: broadcasts WM_SETTINGCHANGE after the PATH registry write
# so already-open shells/Explorer notice without a logoff — the same
# notification Windows installers send. Only the Win32 feature modules
# actually used are enabled: SendMessageTimeoutW plus the
# HWND/WPARAM/LPARAM/LRESULT type aliases it needs, and Threading for
# `os_signal::process_is_alive` (OpenProcess/WaitForSingleObject — the unix
# side of that answer is `kill(pid, 0)`, which needs no feature). 0.61 verified
# current on crates.io at implementation time.
# `Win32_System_JobObjects` is `sandbox_windows.rs`: the job object that bounds a
# sandboxed run's process tree, its committed memory and its window-station
# reach. `Win32_Security` comes with it and is not optional — `CreateJobObjectW`
# names `SECURITY_ATTRIBUTES` in its signature, and that module is itself
# feature-gated, so without it the job-object module does not resolve.
# `Win32_Security_Isolation` is the AppContainer itself, `Win32_Security_Authorization`
# the one ACE that grants it the sandbox root, and `Win32_System_Pipes` the
# stdout/stderr pipes `run_confined` has to create by hand now that it calls
# `CreateProcessW` directly. `Win32_System_IO` and `Win32_System_Ioctl` expose
# the ReFS block-clone request used by the per-run workspace staging tree.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["pdf-extraction"]
pdf-extraction = ["dep:pdf-extract"]

[dev-dependencies]
# The "test" feature exposes tauri::test (mock runtime + IPC dispatch) so the
# command-macro argument-key matching can be exercised in unit tests.
tauri = { version = "2", features = ["test"] }
# The same Matrix SDK as above, plus its `testing` feature, which is only ever
# compiled for `cargo test`.
#
# It brings `matrix_sdk::test_utils::mocks::MatrixMockServer`: a homeserver
# stand-in that implements the *crypto* endpoints for real — `/keys/upload`,
# `/keys/query`, `/keys/claim`, `/sendToDevice` — so two SDK clients perform a
# genuine Olm/Megolm key exchange against it. That is what makes "encryption
# actually works" provable in CI rather than only "plaintext is refused": a
# hand-written protocol fixture can prove a refusal, but it cannot decrypt
# anything, so it can never prove a success.
#
# The production `MatrixAdapter` is the client under test in every one of those
# tests. Nothing here replaces it.
matrix-sdk = { version = "0.18", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    "testing",
] }
# The sync-response builder those helpers take, for putting a room, a timeline
# event or a to-device message into one `/sync` answer.
matrix-sdk-test = "0.18"
# Tiny hostile/limit fixtures compile from WAT during host tests; contributors
# do not need a guest-language toolchain for the sandbox test suite.
wat = "1"
