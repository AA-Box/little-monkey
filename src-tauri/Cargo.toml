[package]
name = "little-monkey"
version = "0.1.0"
description = "Little Monkey — a local model runner with agentic file/shell tools"
authors = ["you"]
edition = "2021"
default-run = "little-monkey"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "little_monkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-util = "0.3.32"
uuid = { version = "1.23.4", features = ["v4"] }
regex = "1.12.4"
walkdir = "2.5.0"
globset = "0.4"
dirs = "6.0.0"
# Platform keystore features are required: without them keyring v3 falls back
# to its in-memory mock store, where every `Entry::new` is an independent
# credential — keys "save" but can never be read back (has_key stays false).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
rustyline = "17"
rmcp = { version = "2.2.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# Only needed by the `mcp_test_server` bin (src/bin/mcp_test_server.rs), a
# trivial stdio MCP server used solely by mcp.rs's unit tests — its
# `#[tool_router]`-annotated methods need `JsonSchema` derives, and that
# derive macro resolves the `schemars` crate path directly (not via rmcp's
# re-export), so it must be a direct dependency here too. Version-matched to
# rmcp's own `schemars = "1.0"` requirement so only one copy resolves.
schemars = "1"

[dev-dependencies]
# The "test" feature exposes tauri::test (mock runtime + IPC dispatch) so the
# command-macro argument-key matching can be exercised in unit tests.
tauri = { version = "2", features = ["test"] }

