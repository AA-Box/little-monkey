name: Dependency security audit

on:
  push:
    branches:
      - develop
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/dependency-security-audit.yml
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/dependency-security-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript dependency advisories
        run: pnpm audit --audit-level low

  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked
      - name: Check Rust dependency advisories
        run: cargo audit --file src-tauri/Cargo.lock
