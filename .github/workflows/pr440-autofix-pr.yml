name: PR 440 autofix validation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'feature/execution-targets'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/execution-targets
          fetch-depth: 0
      - name: Extract and apply staged fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr440-autofix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = source[start:end]
          nonempty = [len(line) - len(line.lstrip()) for line in body if line.strip()]
          indent = min(nonempty) if nonempty else 0
          Path('/tmp/pr440_apply.py').write_text('\n'.join(line[indent:] for line in body) + '\n')
          PY
          python3 /tmp/pr440_apply.py
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Typecheck
        run: pnpm typecheck
      - name: Stage CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Execution target tests
        run: cargo test --manifest-path src-tauri/Cargo.toml execution_target::tests --lib
      - name: Daemon placement tests
        run: cargo test --manifest-path src-tauri/Cargo.toml daemon_commands::tests --lib
      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/pr440-autofix.yml .github/workflows/pr440-autofix-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(execution): complete remote task lifecycle"
          git push origin HEAD:feature/execution-targets
