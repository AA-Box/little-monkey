name: Execution targets

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cargo test --manifest-path src-tauri/Cargo.toml execution_target::tests --lib

  docker-runner-protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the real runner binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin monkey-cli
      - name: Build the app-owned runner image
        run: docker build --tag little-monkey-execution-runner --file docker/execution-runner/Dockerfile .
      - name: Probe the runner through its stdio transport
        shell: bash
        run: |
          response="$(printf '%s\n' '{"type":"probe"}' | docker run --rm -i little-monkey-execution-runner)"
          test "$(printf '%s' "$response" | jq -r '.identity.kind')" = "ssh_runner"
          test "$(printf '%s' "$response" | jq -r '.identity.protocolVersion')" = "1"
