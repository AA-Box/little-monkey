name: Execution targets

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Stage the CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml execution_target::tests --lib

  docker-runner-protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - name: Stage the CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Build the real runner binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin monkey-cli
      - name: Build the app-owned runner image
        run: docker build --tag little-monkey-execution-runner --file docker/execution-runner/Dockerfile .
      - name: Probe the runner through its stdio transport
        shell: bash
        run: |
          response="$(printf '%s\n' '{"type":"probe"}' | docker run --rm -i little-monkey-execution-runner)"
          test "$(printf '%s' "$response" | jq -r '.identity.kind')" = "ssh_runner"
          test "$(printf '%s' "$response" | jq -r '.identity.protocolVersion')" = "1"
      - name: Execute success and nonzero runner tasks through Docker
        env:
          LITTLE_MONKEY_REQUIRE_RUNNER_DOCKER_E2E: "1"
          LITTLE_MONKEY_RUNNER_DOCKER_E2E_IMAGE: little-monkey-execution-runner
        run: cargo test --manifest-path src-tauri/Cargo.toml execution_target::tests --lib

  pr440-lifecycle-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 440
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/execution-targets
          fetch-depth: 0
      - name: Extract and apply staged fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr440-autofix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = source[start:end]
          output = []
          in_triple = False
          for line in body:
              if not in_triple and line.startswith('          '):
                  line = line[10:]
              output.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          Path('/tmp/pr440_apply.py').write_text('\n'.join(output) + '\n')
          PY
          python3 /tmp/pr440_apply.py
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Typecheck
        run: pnpm typecheck
      - name: Stage CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Execution target tests
        run: cargo test --manifest-path src-tauri/Cargo.toml execution_target::tests --lib
      - name: Daemon placement tests
        run: cargo test --manifest-path src-tauri/Cargo.toml daemon_commands::tests --lib
      - name: Commit validated lifecycle fix
        shell: bash
        run: |
          rm -f .github/workflows/pr440-autofix.yml .github/workflows/pr440-autofix-pr.yml
          git show HEAD^:.github/workflows/execution-targets.yml > .github/workflows/execution-targets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(execution): complete remote task lifecycle"
          git push origin HEAD:feature/execution-targets
