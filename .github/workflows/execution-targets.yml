name: Execution targets

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Stage the CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml execution_target::tests --lib

  docker-runner-protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - name: Stage the CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Build the real runner binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin monkey-cli
      - name: Build the app-owned runner image
        run: docker build --tag little-monkey-execution-runner --file docker/execution-runner/Dockerfile .
      - name: Probe the runner through its stdio transport
        shell: bash
        run: |
          response="$(printf '%s\n' '{"type":"probe"}' | docker run --rm -i little-monkey-execution-runner)"
          test "$(printf '%s' "$response" | jq -r '.identity.kind')" = "ssh_runner"
          test "$(printf '%s' "$response" | jq -r '.identity.protocolVersion')" = "1"
      - name: Execute success and nonzero runner tasks through Docker
        env:
          LITTLE_MONKEY_REQUIRE_RUNNER_DOCKER_E2E: "1"
          LITTLE_MONKEY_RUNNER_DOCKER_E2E_IMAGE: little-monkey-execution-runner
        run: cargo test --manifest-path src-tauri/Cargo.toml execution_target::tests --lib

  ssh-runner-protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - name: Stage the CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Build the real runner binary
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin monkey-cli
      - name: Generate an ephemeral SSH identity
        shell: bash
        run: |
          install -d "$RUNNER_TEMP/little-monkey-ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/little-monkey-ssh/id_ed25519"
      - name: Build and start the real SSH runner fixture
        shell: bash
        run: |
          docker build --tag little-monkey-execution-ssh-runner --file docker/execution-runner-ssh/Dockerfile .
          docker run --rm -d \
            --name little-monkey-execution-ssh \
            -p 127.0.0.1:22222:22 \
            -e AUTHORIZED_KEY="$(cat "$RUNNER_TEMP/little-monkey-ssh/id_ed25519.pub")" \
            little-monkey-execution-ssh-runner
          for attempt in $(seq 1 50); do
            if ssh-keyscan -p 22222 127.0.0.1 > "$RUNNER_TEMP/little-monkey-ssh/known_hosts" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done
          test -s "$RUNNER_TEMP/little-monkey-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/little-monkey-ssh/id_ed25519" "$RUNNER_TEMP/little-monkey-ssh/known_hosts"
          ssh \
            -i "$RUNNER_TEMP/little-monkey-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/little-monkey-ssh/known_hosts" \
            -p 22222 monkey@127.0.0.1 \
            monkey runner probe > "$RUNNER_TEMP/little-monkey-ssh/probe.json"
          test "$(jq -r '.identity.protocolVersion' "$RUNNER_TEMP/little-monkey-ssh/probe.json")" = "1"
      - name: Execute the SSH acceptance suite
        env:
          LITTLE_MONKEY_REQUIRE_RUNNER_SSH_E2E: "1"
          LITTLE_MONKEY_RUNNER_SSH_PORT: "22222"
          LITTLE_MONKEY_RUNNER_SSH_KEY_FILE: ${{ runner.temp }}/little-monkey-ssh/id_ed25519
          LITTLE_MONKEY_RUNNER_SSH_KNOWN_HOSTS: ${{ runner.temp }}/little-monkey-ssh/known_hosts
        run: cargo test --manifest-path src-tauri/Cargo.toml --test execution_target_ssh_e2e -- --nocapture
      - name: SSH runner diagnostics
        if: always()
        run: docker logs little-monkey-execution-ssh || true
