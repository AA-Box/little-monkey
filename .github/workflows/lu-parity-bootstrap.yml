name: LU parity implementation

on:
  workflow_dispatch:
  push:
    branches: [feature/lu-parity-media-imports]
    paths:
      - scripts/implement-lu-parity.py
      - .github/workflows/lu-parity-bootstrap.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lu-parity-media-imports
          fetch-depth: 0
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Apply implementation
        run: python3 scripts/implement-lu-parity.py
      - name: Apply validation fixes
        run: |
          sed -i 's/studioClient\.status()/studioClient.engineStatus()/g' src/components/Studio/CreatorHubPanel.tsx
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Frontend build
        run: pnpm build
      - name: Targeted frontend tests
        run: pnpm vitest run src/lib/chatExportImport.test.ts src/lib/studioParity.test.ts
      - name: Rust check
        id: rust_check
        continue-on-error: true
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee /tmp/rust-check.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Preserve generated implementation
        if: always()
        run: |
          if [ "${{ steps.rust_check.outputs.status }}" != "0" ]; then
            cp /tmp/rust-check.log .ci-rust-check.log
          else
            rm -f .ci-rust-check.log
          fi
          rm scripts/implement-lu-parity.py .github/workflows/lu-parity-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add local creator parity workflows"
          git push origin HEAD:feature/lu-parity-media-imports
      - name: Fail when Rust validation failed
        if: always() && steps.rust_check.outcome == 'failure'
        run: exit 1
