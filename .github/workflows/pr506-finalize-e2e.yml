name: PR506 finalize E2E

on:
  push:
    branches:
      - feat/mlx-prefix-cache-lily-runtime

permissions:
  contents: write

concurrency:
  group: pr506-finalize-e2e
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production E2E wiring
        run: python3 scripts/pr506-finalize-e2e.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify MLX cache private ABI
        run: python3 packaging/mlx/service/test_mlx_server.py

      - name: Verify managed Lily lifecycle and fallback
        run: python3 packaging/mlx/service/test_lily_managed.py

      - name: Compile managed service entrypoints
        run: python3 -m py_compile packaging/mlx/service/runtime_router.py packaging/mlx/service/lily_managed.py packaging/mlx/service/mlx_server.py

      - name: Verify package-manifest helpers
        run: pnpm test:mlx-package

      - name: Stage required Tauri CLI sidecar placeholder
        run: pnpm stage:cli:placeholder

      - name: Compile production Rust path
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      - name: Run MLX runtime tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib mlx_runtime::tests -- --nocapture

      - name: Remove superseded manual bridge and bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f packaging/lily/lily_bridge.py packaging/lily/test_lily_bridge.py
          rmdir packaging/lily 2>/dev/null || true
          rm -f scripts/pr506-wire-mlx-cache.py scripts/pr506-finalize-e2e.py
          rm -f .github/workflows/pr506-wire-mlx-cache.yml .github/workflows/pr506-finalize-e2e.yml

      - name: Commit verified production integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: finish MLX cache and managed Lily E2E integration"
          git push origin HEAD:feat/mlx-prefix-cache-lily-runtime
