      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Typecheck
        run: pnpm typecheck
      - name: Stage CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Execution target tests
        run: cargo test --manifest-path src-tauri/Cargo.toml execution_target::tests --lib
      - name: Daemon placement tests
        run: cargo test --manifest-path src-tauri/Cargo.toml daemon_commands::tests --lib
      - name: Commit validated fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/pr440-autofix.yml
          git config user.name "OpenAI Codex Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(execution): complete remote task lifecycle"
          git push origin HEAD:feature/execution-targets
