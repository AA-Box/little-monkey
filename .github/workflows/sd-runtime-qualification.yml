name: SD runtime auto-update qualification

on:
  # Runs normally on changes to the updater itself, so the automation is tested
  # before it can ever be installed on develop.
  pull_request:
    paths:
      - ".github/workflows/update-sd-runtime.yml"
      - ".github/workflows/sd-runtime-qualification.yml"
      - "scripts/update-managed-sd-runtime.mjs"
      - "scripts/update-managed-sd-runtime.test.mjs"
  # Future bot PRs are created with GITHUB_TOKEN, whose pull_request event is
  # intentionally suppressed by GitHub. The updater therefore dispatches this
  # workflow explicitly on the generated branch and supplies the exact head SHA
  # that is allowed to merge.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Automatic runtime-update PR number
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA being qualified
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sd-runtime-qualification-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}

jobs:
  scope:
    name: Verify automatic update scope
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFY_REF }}
          fetch-depth: 0

      - name: Pin qualification to the requested commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Refuse unrelated changes in an automatic update
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop
          allowed='^(scripts/lib/managedRuntimeManifest\.mjs|scripts/lib/managedRuntimeManifest\.test\.mjs|src-tauri/build\.rs|src-tauri/src/managed_runtime\.rs)$'
          changed="$(git diff --name-only origin/develop...HEAD)"
          [ -n "$changed" ] || { echo "Automatic update contains no changes" >&2; exit 1; }
          while IFS= read -r path; do
            if ! [[ "$path" =~ $allowed ]]; then
              echo "Automatic runtime update touched an unrelated file: $path" >&2
              exit 1
            fi
          done <<< "$changed"

  metadata:
    name: Runtime metadata and updater tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFY_REF }}
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate updater and runtime metadata
        run: |
          node --check scripts/update-managed-sd-runtime.mjs
          node --check scripts/stage-managed-runtime.mjs
          node --test scripts/update-managed-sd-runtime.test.mjs scripts/lib/managedRuntimeManifest.test.mjs

      - name: Dry-run live upstream release discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_JSON: ${{ runner.temp }}/sd-runtime-discovery.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-managed-sd-runtime.mjs --output "$UPDATE_JSON"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync(process.env.UPDATE_JSON, "utf8"));
          if (!/^master-\d+-[0-9a-f]{7,40}$/i.test(value.version ?? "")) {
            throw new Error(`invalid discovered release version: ${value.version}`);
          }
          if (!/^[0-9a-f]{40}$/i.test(value.commit ?? "")) {
            throw new Error(`invalid discovered release commit: ${value.commit}`);
          }
          console.log(`Discovered ${value.version} at ${value.commit}`);
          NODE

  core-frontend:
    name: Core frontend regression gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFY_REF }}

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and run core frontend checks
        run: |
          pnpm build:budget
          pnpm test
          pnpm i18n:lint
          pnpm a11y
          pnpm test:runtime-archive

  rust-compile:
    name: Rust compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFY_REF }}

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: sd-runtime-qualification-${{ matrix.os }}

      - name: Prepare app resources needed by Cargo
        run: |
          pnpm install --frozen-lockfile
          pnpm stage:cli:placeholder
          pnpm stage:sherpa-runtime

      - name: Compile the application library
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib --locked

  stage-runtime:
    name: SD runtime (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            source_build: false
          - os: macos-latest
            target: x86_64-apple-darwin
            source_build: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            source_build: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            source_build: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            source_build: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            source_build: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFY_REF }}
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux source-build dependencies
        if: matrix.source_build && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Stage managed SD runtime
        env:
          MANAGED_RUNTIME_TARGET: ${{ matrix.target }}
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: node scripts/stage-managed-runtime.mjs sd

      - name: Verify staged manifest and binary
        env:
          MANAGED_RUNTIME_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import {
            MANAGED_SD_VERSION,
            managedRuntime,
            serverFileName,
            stagedRuntimeDirectory,
          } from "./scripts/lib/managedRuntimeManifest.mjs";
          const target = process.env.MANAGED_RUNTIME_TARGET;
          const runtime = managedRuntime("sd");
          const directory = join("src-tauri", "resources", "managed-runtime", stagedRuntimeDirectory(runtime));
          const manifest = JSON.parse(readFileSync(join(directory, "runtime-manifest.json"), "utf8"));
          const server = serverFileName(runtime, target);
          if (manifest.version !== MANAGED_SD_VERSION) throw new Error("wrong runtime version");
          if (manifest.target !== target) throw new Error("wrong runtime target");
          if (!/^[0-9a-f]{64}$/.test(manifest.archiveSha256)) throw new Error("invalid runtime provenance digest");
          const entry = manifest.files.find((file) => file.name === server);
          if (!entry?.executable) throw new Error(`manifest does not carry executable ${server}`);
          if (statSync(join(directory, server)).size <= 0) throw new Error(`${server} is empty`);
          NODE

      - name: Smoke-test native runtime executable
        if: matrix.target != 'x86_64-apple-darwin'
        env:
          MANAGED_RUNTIME_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { join, resolve } from "node:path";
          import { managedRuntime, serverFileName, stagedRuntimeDirectory } from "./scripts/lib/managedRuntimeManifest.mjs";
          const target = process.env.MANAGED_RUNTIME_TARGET;
          const runtime = managedRuntime("sd");
          const binary = resolve(join("src-tauri", "resources", "managed-runtime", stagedRuntimeDirectory(runtime), serverFileName(runtime, target)));
          const result = spawnSync(binary, ["--help"], { encoding: "utf8" });
          if (result.error) throw result.error;
          if (result.status !== 0) throw new Error(`sd-server --help exited ${result.status}: ${result.stderr}`);
          const output = `${result.stdout}\n${result.stderr}`;
          if (!output.includes("--diffusion-model")) throw new Error("staged sd-server does not expose --diffusion-model");
          NODE

      - name: Verify Intel macOS source-build architecture
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          directory="$(node --input-type=module -e 'import { managedRuntime, stagedRuntimeDirectory } from "./scripts/lib/managedRuntimeManifest.mjs"; process.stdout.write(stagedRuntimeDirectory(managedRuntime("sd")));')"
          file "src-tauri/resources/managed-runtime/${directory}/sd-server" | grep -E 'x86_64|x86-64'

  merge:
    name: Merge exact qualified head
    if: github.event_name == 'workflow_dispatch'
    needs: [scope, metadata, core-frontend, rust-compile, stage-runtime]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
    steps:
      - name: Re-check PR identity and merge only this SHA
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          base="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)"
          head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$state" = "OPEN" ] || { echo "PR is no longer open" >&2; exit 1; }
          [ "$base" = "develop" ] || { echo "PR base changed from develop" >&2; exit 1; }
          [[ "$head" == automation/sd-runtime-* ]] || { echo "Unexpected PR head: $head" >&2; exit 1; }
          [ "$sha" = "$EXPECTED_HEAD_SHA" ] || { echo "PR head moved after qualification" >&2; exit 1; }

          response="$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=squash -f sha="$EXPECTED_HEAD_SHA")"
          merged="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.merged === true))' "$response")"
          [ "$merged" = "true" ] || { echo "$response" >&2; exit 1; }
          echo "Merged PR #${PR_NUMBER} after exact-head qualification." >> "$GITHUB_STEP_SUMMARY"
