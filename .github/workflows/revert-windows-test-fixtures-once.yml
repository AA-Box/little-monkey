name: Revert Windows test fixture rewrites once

on:
  push:
    branches:
      - fix/zero-config-whisper
    paths:
      - .github/workflows/revert-windows-test-fixtures-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-config-whisper
          fetch-depth: 0

      - name: Restore unchanged verification tests from develop
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/develop -- src-tauri/src/verify.rs src-tauri/src/skill_learning.rs
          rm .github/workflows/revert-windows-test-fixtures-once.yml
          git diff --check
          git diff -- src-tauri/src/verify.rs src-tauri/src/skill_learning.rs

      - name: Commit source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: restore baseline verification fixtures"
          git push origin HEAD:fix/zero-config-whisper
