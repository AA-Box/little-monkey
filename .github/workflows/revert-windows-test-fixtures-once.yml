name: Revert Windows test fixture rewrites once

on:
  push:
    branches:
      - fix/zero-config-whisper
    paths:
      - .github/workflows/revert-windows-test-fixtures-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-config-whisper
          fetch-depth: 0

      - name: Restore develop test commands
        shell: python
        run: |
          from pathlib import Path

          verify = Path("src-tauri/src/verify.rs")
          text = verify.read_text()
          old = 'command("c1", &long_running_command())'
          if text.count(old) != 4:
              raise SystemExit(f"expected four PR-only long-running replacements, found {text.count(old)}")
          verify.write_text(text.replace(old, 'command("c1", "sleep 30")'))

          learning = Path("src-tauri/src/skill_learning.rs")
          text = learning.read_text()
          old = '        #[cfg(target_os = "windows")]\n        let command = r#"if exist src\\uploader.rs (exit /b 0) else (exit /b 1)"#;\n        #[cfg(not(target_os = "windows"))]\n        let command = "test -f src/uploader.rs";\n        crate::verify::VerifyCommand {\n            id: "verify-1".to_string(),\n            label: "sources present".to_string(),\n            kind: "test".to_string(),\n            command: command.to_string(),'
          new = '        crate::verify::VerifyCommand {\n            id: "verify-1".to_string(),\n            label: "sources present".to_string(),\n            kind: "test".to_string(),\n            command: "test -f src/uploader.rs".to_string(),'
          if text.count(old) != 1:
              raise SystemExit(f"expected one read-only Windows fixture block, found {text.count(old)}")
          text = text.replace(old, new, 1)
          old = '        #[cfg(target_os = "windows")]\n        let command = r#"findstr /L /C:with_retry src\\uploader.rs > nul"#;\n        #[cfg(not(target_os = "windows"))]\n        let command = "grep -q \'with_retry(\' src/uploader.rs";\n        crate::verify::VerifyCommand {\n            id: "verify-1".to_string(),\n            label: "retry present".to_string(),\n            kind: "test".to_string(),\n            command: command.to_string(),'
          new = '        crate::verify::VerifyCommand {\n            id: "verify-1".to_string(),\n            label: "retry present".to_string(),\n            kind: "test".to_string(),\n            command: "grep -q \'with_retry(\' src/uploader.rs".to_string(),'
          if text.count(old) != 1:
              raise SystemExit(f"expected one mutation verification Windows fixture block, found {text.count(old)}")
          learning.write_text(text.replace(old, new, 1))

          Path(".github/workflows/revert-windows-test-fixtures-once.yml").unlink()

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src-tauri/src/verify.rs src-tauri/src/skill_learning.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: restore baseline verification fixtures"
          git push origin HEAD:fix/zero-config-whisper
