name: Wayland integration bootstrap

on:
  push:
    branches:
      - fix/wayland-computer-use

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wayland-computer-use

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential dbus-x11 gnome-keyring

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply targeted integration changes
        run: |
          python3 scripts/apply-wayland-computer-use-integration.py
          python3 scripts/fix-wayland-portal-types.py

      - name: Format changed Rust sources
        run: rustfmt --edition 2021 src-tauri/src/desktop_control.rs src-tauri/src/desktop_control/wayland_portal.rs

      - name: Compile Linux production path
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib

      - name: Run Wayland portal unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib desktop_control::wayland_portal::tests -- --nocapture

      - name: Commit verified integration
        run: |
          rm scripts/apply-wayland-computer-use-integration.py
          rm scripts/fix-wayland-portal-types.py
          rm .github/workflows/wayland-integration-bootstrap.yml
          rm -f .wayland-ci-trigger
          rustfmt --edition 2021 src-tauri/src/desktop_control.rs src-tauri/src/desktop_control/wayland_portal.rs
          git config user.name "little-monkey-wayland-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(computer-use): wire secure Wayland portal support"
          git push origin HEAD:fix/wayland-computer-use
