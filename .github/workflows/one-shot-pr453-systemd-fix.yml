name: One-shot PR 453 systemd renderer fix

on:
  push:
    branches:
      - fix/channel-secret-daemon-ownership
    paths:
      - .github/workflows/one-shot-pr453-systemd-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/channel-secret-daemon-ownership
          fetch-depth: 0

      - name: Patch committed systemd renderer and regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/bin/monkey-cli/daemon/service.rs")
          source = path.read_text()

          renderer_start = source.index("            ServicePlatform::SystemdUser => format!(")
          renderer_end = source.index("            ServicePlatform::WindowsTask => {", renderer_start)
          renderer = source[renderer_start:renderer_end]

          if renderer.count("WorkingDirectory={}") != 1:
              raise SystemExit(
                  f"expected exactly one systemd WorkingDirectory placeholder, found {renderer.count('WorkingDirectory={}')}"
              )
          renderer = renderer.replace("WorkingDirectory={}", "WorkingDirectory=%h", 1)

          arg = "                systemd_escape(user_home),\n"
          if renderer.count(arg) != 1:
              raise SystemExit(
                  f"expected exactly one obsolete WorkingDirectory format argument, found {renderer.count(arg)}"
              )
          renderer = renderer.replace(arg, "", 1)
          source = source[:renderer_start] + renderer + source[renderer_end:]

          test_marker = "    fn manifests_quote_executable_and_use_explicit_daemon_serve() {"
          test_start = source.index(test_marker)
          try:
              test_end = source.index("\n    #[test]\n", test_start + len(test_marker))
          except ValueError:
              test_end = len(source)
          test = source[test_start:test_end]
          matching = [
              line
              for line in test.splitlines()
              if "assert!(rendered.contains" in line and "WorkingDirectory=" in line
          ]
          if len(matching) != 1:
              raise SystemExit(
                  f"expected exactly one WorkingDirectory render assertion, found {len(matching)}: {matching}"
              )
          old_line = matching[0]
          indent = old_line[: len(old_line) - len(old_line.lstrip())]
          new_lines = (
              f'{indent}assert!(rendered.contains("WorkingDirectory=%h"));\n'
              f'{indent}assert!(!rendered.contains(r#"WorkingDirectory=\"/home/test\""#));'
          )
          test = test.replace(old_line, new_lines, 1)
          source = source[:test_start] + test + source[test_end:]

          path.write_text(source)
          PY

          git diff --check
          git diff -- src-tauri/src/bin/monkey-cli/daemon/service.rs

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/bin/monkey-cli/daemon/service.rs
          git commit -m "fix(daemon): render valid systemd working directory"
          git push origin HEAD:fix/channel-secret-daemon-ownership
