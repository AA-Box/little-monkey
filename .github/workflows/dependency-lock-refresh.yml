name: Dependency lockfile refresh (temporary)

on:
  push:
    branches:
      - security/dependabot-remediate-20261013
    paths:
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'AA-Box/little-monkey' && github.ref == 'refs/heads/security/dependabot-remediate-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve patched transitive dependencies and regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit generated lockfile to remediation branch
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "fix(deps): regenerate lockfile with patched transitive versions"
            git push origin HEAD:security/dependabot-remediate-20261013
          fi
      - name: Verify no npm advisories remain
        run: pnpm audit --audit-level low
