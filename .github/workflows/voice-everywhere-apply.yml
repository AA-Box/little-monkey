name: Voice Everywhere atomic patch applier

on:
  push:
    branches:
      - feat/voice-everywhere

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged Voice Everywhere patch
        shell: bash
        run: |
          set -euo pipefail
          ready=.github/voice-everywhere-patch.ready
          if [ ! -f "$ready" ]; then
            echo "Patch parts are still being staged; nothing to apply."
            exit 0
          fi
          shopt -s nullglob
          parts=(.github/voice-everywhere-patch.part-*)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "Ready marker exists without patch parts" >&2
            exit 1
          fi
          cat "${parts[@]}" > /tmp/voice-everywhere.patch
          git apply --check /tmp/voice-everywhere.patch
          git apply /tmp/voice-everywhere.patch
          rm -f "$ready" "${parts[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(voice): harden endpoint routing and bounded audio streaming"
          git push origin HEAD:feat/voice-everywhere
