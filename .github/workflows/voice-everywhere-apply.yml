name: Voice Everywhere atomic patch applier

on:
  push:
    branches:
      - feat/voice-everywhere

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged Voice Everywhere patch
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/voice-everywhere-batch.patch
          if [ ! -f "$patch" ]; then
            echo "No staged patch; nothing to apply."
            exit 0
          fi
          git apply --check "$patch"
          git apply "$patch"
          rm "$patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(voice): harden endpoint routing and bounded audio streaming"
          git push origin HEAD:feat/voice-everywhere
