# TEMPORARY: measures what the portable whisper.cpp baseline costs against a
# build tuned to the runner, on the same machine. Removed before merge.
name: GGML baseline benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/ggml-baseline-bench.yml'

permissions:
  contents: read

jobs:
  bench:
    name: native vs portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install build and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake clang libclang-dev ninja-build ffmpeg jq
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stage CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Prepare speech fixtures
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/ggerganov/whisper.cpp/2eeeba56e9edd762b4b38467bab96c2517163158/samples/jfk.wav \
            --output "$RUNNER_TEMP/jfk.wav"
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/jfk.wav" -c:a libopus "$RUNNER_TEMP/jfk.webm"
          echo "LITTLE_MONKEY_LOCAL_WHISPER_E2E_WAV=$RUNNER_TEMP/jfk.wav" >> "$GITHUB_ENV"
          echo "LITTLE_MONKEY_LOCAL_WHISPER_E2E_WEBM=$RUNNER_TEMP/jfk.webm" >> "$GITHUB_ENV"
      - name: Runner CPU
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'
          grep -o -w -E 'avx512f|avx2|sve2|sve|i8mm|asimddp' /proc/cpuinfo | sort | uniq -c
      - name: Build the e2e test binary both ways
        run: |
          set -euo pipefail
          build() {
            cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "little_monkey_lib") | .executable'
          }
          flags() {
            grep -hE '^(GGML_NATIVE|GGML_CPU_ARM_ARCH|GGML_AVX512|HAVE_[A-Z0-9_]+):' src-tauri/target/release/build/whisper-rs-sys-*/out/build/CMakeCache.txt
            grep -rhoE -- '-m(arch|cpu)=[^ ]+' src-tauri/target/release/build/whisper-rs-sys-*/out/build/ggml/src --include=flags.make --include=build.ninja | sort -u || true
          }
          bin="$(GGML_NATIVE=ON GGML_CPU_ARM_ARCH= build)"
          cp "$bin" "$RUNNER_TEMP/native"
          echo "== native"; flags
          cargo clean --release --manifest-path src-tauri/Cargo.toml -p whisper-rs-sys
          bin="$(build)"
          cp "$bin" "$RUNNER_TEMP/portable"
          echo "== portable"; flags
      - name: Transcribe with each, alternately
        working-directory: src-tauri
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5; do
            for variant in native portable; do
              echo "== $variant, round $round"
              "$RUNNER_TEMP/$variant" local_whisper::tests::e2e_auto_provisions_and_transcribes_real_audio --exact --nocapture 2>&1 \
                | grep -E 'transcribed|test result'
            done
          done
