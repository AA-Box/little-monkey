name: Voice Everywhere source snapshot
on:
  push:
    branches:
      - feat/voice-everywhere
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: little-monkey-source-current
          path: .
          include-hidden-files: true
          retention-days: 1
