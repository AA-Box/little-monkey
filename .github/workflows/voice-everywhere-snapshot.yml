name: voice-everywhere-snapshot

on:
  push:
    branches:
      - feat/voice-everywhere
    paths:
      - .github/workflows/voice-everywhere-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack checkout
        run: tar --exclude=.git -czf /tmp/little-monkey-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: little-monkey-source
          path: /tmp/little-monkey-source.tar.gz
          if-no-files-found: error
          retention-days: 1
