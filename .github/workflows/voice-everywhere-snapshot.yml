name: voice-everywhere-apply

on:
  push:
    branches:
      - feat/voice-everywhere
    paths:
      - .github/workflows/voice-everywhere-snapshot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Voice Everywhere implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/voice-everywhere-patch/part-* > /tmp/voice-everywhere.patch
          echo "b19e8e7fc592e8b1e28973c97021be3d7e5e8bca61a73c6e6517dfc5e60da372  /tmp/voice-everywhere.patch" | sha256sum -c -
          git apply --check /tmp/voice-everywhere.patch
          git apply /tmp/voice-everywhere.patch
          git diff --check
          git rm -r .github/voice-everywhere-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(voice): add host-authoritative cross-device Talk routes"
          git push origin HEAD:feat/voice-everywhere
