name: Telegram installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/telegram_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/telegram.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/**"
      - "src-tauri/src/bin/monkey-cli/channels_cli.rs"
      - ".github/workflows/telegram-installed-service-e2e.yml"
      - "docs/telegram-installed-service-e2e.md"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile arbitrary-user Telegram acceptance harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libdbus-1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: telegram-installed-service
      - name: Create the build-time CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Compile black-box Telegram harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example telegram_installed_service_e2e
      - name: Explain live-provider boundary
        run: |
          cat <<'EOF'
          PR CI compiles but deliberately does not execute the live Telegram run.
          Literal execution is interactive: the operator supplies a BotFather token
          for a bot they own, then a previously unknown real Telegram user sends the
          pairing marker and the later execution marker. The harness approves the
          discovered sender through Little Monkey's production sender-approval path.
          No repository-owned bot, chat, Telegram user or token is required.
          EOF
