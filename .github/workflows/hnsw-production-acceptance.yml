name: HNSW production acceptance

on:
  pull_request:
    paths:
      - 'src-tauri/src/knowledge_pipeline/hnsw.rs'
      - 'src-tauri/src/knowledge_pipeline/hnsw/**'
      - 'src-tauri/src/knowledge_pipeline.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/hnsw-production-acceptance.yml'
  workflow_dispatch:
    inputs:
      corpus:
        description: 'Number of persisted vectors (production ceiling: 100000)'
        type: choice
        options: ['10000', '50000', '100000']
        default: '100000'
      dimension:
        description: 'Embedding dimensions'
        type: choice
        options: ['128', '384', '768']
        default: '384'
  schedule:
    - cron: '15 3 * * 0'

permissions:
  contents: read

concurrency:
  group: hnsw-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  persisted-hnsw:
    name: Real SQLite scale / recall / reliability
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      LM_HNSW_DB: ${{ github.workspace }}/artifacts/hnsw.sqlite3
      LM_HNSW_REPORT: ${{ github.workspace }}/artifacts/metrics.json
      LM_HNSW_COUNT: ${{ github.event_name == 'pull_request' && '100000' || inputs.corpus || '100000' }}
      LM_HNSW_DIM: ${{ github.event_name == 'pull_request' && '384' || inputs.dimension || '384' }}
      LM_HNSW_QUERIES: '64'
      LM_HNSW_MIN_RECALL: '0.80'
      LM_HNSW_MAX_P95_MS: '250'
      LM_HNSW_MAX_BUILD_S: '3600'
      LM_HNSW_MIN_QPS: '8'
      LM_HNSW_MAX_RSS_MIB: '3500'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free space for native Tauri/Rust compilation
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential pkg-config cmake clang libclang-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Record provenance and host resources
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          uname -a > artifacts/host.txt
          lscpu >> artifacts/host.txt
          free -h >> artifacts/host.txt

      - name: Build actual immutable index, exact recall oracle, and parallel SQLite readers
        working-directory: src-tauri
        run: |
          cargo test --locked --release --lib production_hnsw_scale_gate -- \
            --ignored --nocapture --test-threads=1

      - name: New test process must reopen, retrieve, and reject graph corruption
        working-directory: src-tauri
        run: |
          cargo test --locked --release --lib production_hnsw_fresh_process_reopen_gate -- \
            --ignored --nocapture --test-threads=1

      - name: Retain measurable evidence even if a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnsw-acceptance-${{ github.run_id }}
          path: |
            artifacts/metrics.json
            artifacts/commit.txt
            artifacts/host.txt
          if-no-files-found: warn
          retention-days: 30
