name: Bootstrap PR 448 Rust CI fixes

on:
  push:
    branches:
      - fix/remote-execution-e2e-ssh-remotenode
    paths:
      - .github/workflows/fix-pr448-rust-ci.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remote-execution-e2e-ssh-remotenode
          fetch-depth: 0
      - name: Patch daemon target typing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/daemon_commands.rs')
          text = path.read_text()

          old = '''        let target = crate::execution_target::RemoteNodeTarget::from_snapshot(snapshot)
              .map_err(|error| error.to_string())?;
          (Box::new(target), None)
          '''
          new = '''        let target = crate::execution_target::RemoteNodeTarget::from_snapshot(snapshot)
              .map_err(|error| error.to_string())?;
          let target: Box<dyn crate::execution_target::ExecutionTarget> = Box::new(target);
          (target, None)
          '''
          if old not in text:
              raise SystemExit('remote-node target block did not match expected source')
          text = text.replace(old, new, 1)

          old = '''    let runner_result = target
              .events(&handle, 0)
              .ok()
              .and_then(|events| autonomous_runner_result_from_events(&events));
          '''
          new = '''    let runner_events = target.events(&handle, 0).ok();
          let runner_result = runner_events
              .as_deref()
              .and_then(autonomous_runner_result_from_events);
          '''
          if old not in text:
              raise SystemExit('runner-result event block did not match expected source')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/daemon_commands.rs
          git commit -m "fix: repair remote execution target typing"
          git push origin HEAD:fix/remote-execution-e2e-ssh-remotenode
      - name: Verify Rust library compiles
        shell: bash
        run: |
          node scripts/ensure-cli-sidecar-placeholder.mjs
          cargo check --manifest-path src-tauri/Cargo.toml --lib
