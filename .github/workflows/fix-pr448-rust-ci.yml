name: Verify PR 448 Rust CI fix

on:
  push:
    branches:
      - fix/remote-execution-e2e-ssh-remotenode
    paths:
      - .github/workflows/fix-pr448-rust-ci.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remote-execution-e2e-ssh-remotenode
          fetch-depth: 0
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential dbus-x11 gnome-keyring btrfs-progs
      - name: Verify Rust library compiles
        shell: bash
        run: |
          node scripts/ensure-cli-sidecar-placeholder.mjs
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee .github/pr448-cargo-check.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -f .github/pr448-cargo-check.txt
            git commit -m "ci: capture PR 448 Rust compiler diagnostics"
            git push origin HEAD:fix/remote-execution-e2e-ssh-remotenode
          fi
          exit "$status"
