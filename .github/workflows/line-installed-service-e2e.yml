name: LINE installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/line_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/line.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/webhook.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/**"
      - "src-tauri/src/bin/monkey-cli/channels_cli.rs"
      - ".github/workflows/line-installed-service-e2e.yml"
      - "docs/line-installed-service-e2e.md"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile real-account acceptance harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libdbus-1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: line-installed-service
      - name: Create the build-time CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Compile black-box LINE harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example line_installed_service_e2e
      - name: Explain live-provider boundary
        run: |
          cat <<'EOF'
          Hosted PR CI compiles but does not execute the live LINE acceptance.
          A literal run needs a real Messaging API channel, a public HTTPS callback,
          and an independent LINE user. The harness asks LINE itself to test the
          callback, then requires the independent user to send the marker and to
          copy the exact generated reply back from the real LINE client. A push API
          success alone is not accepted as recipient observation.
          EOF
