name: Voice Everywhere Push

on:
  push:
    branches:
      - feat/voice-everywhere-stage2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voice-everywhere-stage2
          fetch-depth: 0
      - name: Reassemble local implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .voice-everywhere-stage/part-* > /tmp/voice.patch.xz.b64
          base64 -d /tmp/voice.patch.xz.b64 > /tmp/voice.patch.xz
          xz -dc /tmp/voice.patch.xz > /tmp/voice.patch
      - name: Apply to PR branch and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/voice-everywhere
          git checkout -B feat/voice-everywhere origin/feat/voice-everywhere
          git apply --check /tmp/voice.patch
          git apply /tmp/voice.patch
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(voice): wire routed Talk end to end"
          git push origin HEAD:feat/voice-everywhere
