name: Finalize Standards Studio

on:
  push:
    branches: [feat/standards-studio]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[standards-finalized]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standards-studio
      - name: Apply finalizer
        run: python scripts/finalize-standards-studio.py
      - name: Remove one-shot machinery
        run: |
          rm scripts/finalize-standards-studio.py
          rm .github/workflows/finalize-standards-studio.yml
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: complete Standards Studio end-to-end [standards-finalized]"
          git push origin HEAD:feat/standards-studio
