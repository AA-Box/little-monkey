name: Executable extension SDK

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  rust-guests:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: extensions-sdk
          key: executable-extension-sdk

      - name: Test SDK and compile canonical WIT bindings
        run: |
          cargo test --manifest-path extensions-sdk/Cargo.toml --workspace --locked
          node --test extensions-sdk/scripts/*.test.mjs

      - name: Build WASI Preview 2 components
        run: >-
          cargo build --manifest-path extensions-sdk/Cargo.toml --workspace
          --target wasm32-wasip2 --release --locked

      - name: Package automated examples
        run: |
          set -euo pipefail
          for example in simple-tool mock-channel mock-stt-provider; do
            node extensions-sdk/scripts/package-example.mjs "$example" "$GITHUB_SHA"
            test -s "extensions-sdk/dist/$example/component.wasm"
            test -s "extensions-sdk/dist/$example/extension.json"
            if grep -q '__[A-Z_]*__' "extensions-sdk/dist/$example/extension.json"; then
              echo "unresolved manifest placeholder in $example" >&2
              exit 1
            fi
          done

  developer-loop-e2e:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install host runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential openssl

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-wasip2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: executable-extension-developer-loop

      - name: Stage the CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs

      - name: Build real monkey CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin monkey-cli --locked

      - name: Run init dev test validate pack sign publish lifecycle
        shell: bash
        run: |
          set -euo pipefail
          MONKEY="$PWD/src-tauri/target/debug/monkey-cli"
          PROJECT="$RUNNER_TEMP/dev-extension"
          REGISTRY="$RUNNER_TEMP/registry"
          mkdir -p "$REGISTRY"

          "$MONKEY" extensions init "$PROJECT" \
            --id dev.example.e2e \
            --name "Developer Loop E2E" \
            --template tool \
            --publisher "CI Publisher"

          "$MONKEY" extensions dev "$PROJECT" --once \
            --capability echo --input '{"text":"dev"}'
          "$MONKEY" extensions test "$PROJECT" --json
          "$MONKEY" extensions validate "$PROJECT" --json
          "$MONKEY" extensions pack "$PROJECT" \
            --output "$RUNNER_TEMP/unsigned.lmx" --json

          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/publisher.pem"
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/registry.pem"
          "$MONKEY" extensions sign "$RUNNER_TEMP/unsigned.lmx" \
            --private-key "$RUNNER_TEMP/publisher.pem" \
            --trust-root-id ci.publisher \
            --key-id release-key \
            --output "$RUNNER_TEMP/signed.lmx" --json

          cat > "$REGISTRY/index.json" <<'JSON'
          {
            "schema_version": 1,
            "registry_id": "ci-registry",
            "sequence": 1,
            "generated_unix_ms": 1,
            "refresh_after_unix_ms": 2,
            "expires_unix_ms": 3,
            "packages": {},
            "revocations": [],
            "signature": {
              "trust_root_id": "ci.registry",
              "key_id": "registry-key",
              "algorithm": "ed25519",
              "signature_hex": ""
            }
          }
          JSON

          "$MONKEY" extensions publish "$PROJECT" \
            --snapshot "$REGISTRY/index.json" \
            --registry-root "$REGISTRY" \
            --publisher-private-key "$RUNNER_TEMP/publisher.pem" \
            --trust-root-id ci.publisher \
            --key-id release-key \
            --registry-private-key "$RUNNER_TEMP/registry.pem" \
            --output "$RUNNER_TEMP/published.lmx" --json

          test -s "$REGISTRY/extensions/dev.example.e2e/0.1.0.lmx"
          grep -q 'extension.dev.example.e2e' "$REGISTRY/index.json"
          node --input-type=module - "$RUNNER_TEMP/published.lmx" <<'NODE'
          import { readFile } from "node:fs/promises";
          import { validateLmxEnvelope } from "./src/lib/extensionMarketplace.ts";
          const path = process.argv[2];
          validateLmxEnvelope(JSON.parse(await readFile(path, "utf8")));
          NODE

  arm-host-runtime:
    name: ARM host runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: executable-extension-${{ matrix.os }}

      # `build.rs` calls `tauri-build`, which refuses to run without the
      # `monkey-cli` sidecar at the `externalBin` path — and that binary is
      # gitignored, so a fresh checkout has none. The same bootstrap `ci.yml`
      # does before its own Rust tests: an empty placeholder, not a real build,
      # since nothing here executes the CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage the CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs

      - name: Exercise the Component Model sandbox on the release architecture
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          executable_extensions::tests --locked
