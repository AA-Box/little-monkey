name: WhatsApp installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/whatsapp_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/whatsapp.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/webhook.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/**"
      - "src-tauri/src/bin/monkey-cli/channels_cli.rs"
      - ".github/workflows/whatsapp-installed-service-e2e.yml"
      - "docs/whatsapp-installed-service-e2e.md"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile real-account acceptance harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libdbus-1-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: whatsapp-installed-service

      - name: Create the build-time CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs

      - name: Compile black-box WhatsApp harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example whatsapp_installed_service_e2e

      - name: Explain why hosted PR CI does not impersonate a WhatsApp user
        run: |
          cat <<'EOF'
          The harness is intentionally compiled, not executed, on GitHub-hosted PR runners.
          A literal run needs a real WhatsApp Business Cloud API number, an HTTPS callback
          that routes to the installed daemon, and an independent real WhatsApp identity
          that sends the one unique marker. Meta exposes no consumer API that can honestly
          manufacture that independent handset/user boundary in CI.

          The live harness does not accept Graph API 200 as delivery proof. After the
          installed daemon's production agent sends the generated reply, it waits for
          Meta's signed delivered/read webhook for that exact wamid.
          EOF
