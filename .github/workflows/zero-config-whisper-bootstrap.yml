name: Zero-config Whisper bootstrap

on:
  push:
    branches:
      - fix/zero-config-whisper

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[zero-whisper-patched]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-config-whisper
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Apply source integration
        run: python3 scripts/apply-zero-config-whisper.py
      - name: Refresh Cargo.lock for pinned speech dependencies
        working-directory: src-tauri
        run: cargo generate-lockfile
      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/src/lib.rs src-tauri/src/m7_companion.rs src-tauri/src/local_whisper.rs src/components/Settings/CompanionPanel.tsx src/components/Settings/CompanionPanel.test.tsx src/components/Talk/TalkPanel.test.tsx src/lib/companionClient.ts
          git commit -m "feat(talk): wire automatic local Whisper end to end [zero-whisper-patched]"
          git push origin HEAD:fix/zero-config-whisper

  verify-linux:
    if: ${{ contains(github.event.head_commit.message, '[zero-whisper-patched]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake clang
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend speech tests
        run: pnpm test -- src/components/Settings/CompanionPanel.test.tsx src/components/Talk/TalkPanel.test.tsx
      - name: Rust library check
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib
      - name: Local Whisper unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib local_whisper::tests -- --nocapture
