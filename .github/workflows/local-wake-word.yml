name: Local Wake Word

on:
  pull_request:
    paths:
      - 'vendor/sherpa-onnx-sys/**'
      - 'scripts/stage-sherpa-runtime.mjs'
      - 'scripts/stage-wake-word-model.mjs'
      - 'scripts/lib/wakeWordAssets.test.mjs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/local_wake_word.rs'
      - 'src-tauri/src/local_whisper.rs'
      - 'src-tauri/src/m7_companion.rs'
      - 'src-tauri/tauri.conf.json'
      - 'src/components/Talk/**'
      - 'src/components/Settings/VoiceSettingsSection.tsx'
      - 'src/lib/talkAudio*'
      - 'src/lib/talkClient.ts'
      - 'src/lib/talkEngine*'
      - '.github/workflows/local-wake-word.yml'
  push:
    branches: [main, develop]
    paths:
      - 'vendor/sherpa-onnx-sys/**'
      - 'scripts/stage-sherpa-runtime.mjs'
      - 'scripts/stage-wake-word-model.mjs'
      - 'scripts/lib/wakeWordAssets.test.mjs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/local_wake_word.rs'
      - 'src-tauri/src/local_whisper.rs'
      - 'src-tauri/src/m7_companion.rs'
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/local-wake-word.yml'

permissions:
  contents: read

concurrency:
  group: local-wake-word-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-runtime-targets:
    name: authenticated compile (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: Windows arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake clang libclang-dev ninja-build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: local-wake-word-${{ matrix.target }}
      - name: Stage and authenticate the target's native runtime
        run: node scripts/stage-sherpa-runtime.mjs ${{ matrix.target }}
      - name: Compile the statically linked KWS path
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

  real-inference:
    name: real KWS fixtures and wake-to-Whisper boundary
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      LITTLE_MONKEY_KWS_E2E: 1
      LITTLE_MONKEY_WAKE_TO_WHISPER_E2E: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake clang libclang-dev ninja-build
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: local-wake-word-real-inference
      - run: pnpm install --frozen-lockfile
      - name: Verify manifests and stage authenticated assets
        run: |
          pnpm test:wake-assets
          pnpm stage:sherpa-runtime
          pnpm stage:wake-word
          pnpm stage:whisper
      - name: Real native positive, negative, near-phrase, pause and noise fixtures
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib local_wake_word::tests::real_model_detects_positive_audio_and_rejects_negative_audio -- --nocapture
      - name: Real KWS hands only post-keyword PCM to real local Whisper
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib local_wake_word::tests::real_wake_event_feeds_only_command_pcm_to_local_whisper -- --nocapture

  bundle:
    name: Linux installer carries verified KWS assets
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential xdg-utils unzip cmake clang libclang-dev ninja-build
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: local-wake-word-bundle
      - run: pnpm install --frozen-lockfile
      - name: Stage CLI sidecar placeholder
        env:
          CLI_SIDECAR_TARGET: x86_64-unknown-linux-gnu
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Generate throwaway updater signing key
        run: |
          set -euo pipefail
          pnpm tauri signer generate --ci -p "" -w "$RUNNER_TEMP/updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/updater.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
      - name: Build installable package through production staging
        run: pnpm tauri build --bundles deb
      - name: Verify every required KWS model file is packaged
        shell: bash
        run: |
          set -euo pipefail
          package="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb -c "$package" > "$RUNNER_TEMP/bundle-contents.txt"
          for file in \
            README.md bpe.model tokens.txt \
            encoder-epoch-12-avg-2-chunk-16-left-64.onnx \
            decoder-epoch-12-avg-2-chunk-16-left-64.onnx \
            joiner-epoch-12-avg-2-chunk-16-left-64.onnx; do
            grep -F "local-wake-word/$file" "$RUNNER_TEMP/bundle-contents.txt"
          done
