name: Voice Everywhere Validate

on:
  push:
    branches:
      - feat/voice-everywhere-stage8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voice-everywhere
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Voice unit tests
        run: pnpm vitest run src/lib/mobileTalkProtocol.test.ts src/lib/talkEngine.test.ts src/components/Talk/useTalkSession.test.tsx
      - name: Stage CLI placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Rust check monkey-cli
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin monkey-cli
      - name: Rust voice tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin monkey-cli remote -- --nocapture

# validation trigger 2
