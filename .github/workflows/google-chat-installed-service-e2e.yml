name: Google Chat installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/google_chat_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/google_chat.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/webhook.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/**"
      - "src-tauri/src/bin/monkey-cli/channels_cli.rs"
      - ".github/workflows/google-chat-installed-service-e2e.yml"
      - "docs/google-chat-installed-service-e2e.md"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-chat-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile real-account acceptance harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libdbus-1-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: google-chat-installed-service

      - name: Create the build-time CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs

      - name: Compile black-box Google Chat harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example google_chat_installed_service_e2e

      - name: Explain why hosted PR CI does not impersonate a Google Chat user
        run: |
          cat <<'TEXT'
          The harness is intentionally compiled, not executed, on GitHub-hosted PR runners.
          A literal run requires a configured Google Chat app HTTP endpoint, its real
          service-account key, and an independent Workspace user who can send the marker
          and read the exact reply. PR CI cannot honestly manufacture that provider-owned
          identity/application boundary.

          The live harness does not treat a successful Chat API create as observation.
          It requires the independent user's OAuth credential to GET the exact generated
          message resource and compare its text byte-for-byte with the expected reply.
          TEXT
