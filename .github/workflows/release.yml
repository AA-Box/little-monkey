name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Release preflight
        run: pnpm release:preflight

  release:
    needs: preflight
    # `label` exists only so the job reads as "release (Linux x86_64)" instead of
    # "release (ubuntu-22.04, x86_64-unknown-linux-gnu)". The `unknown` there is
    # the vendor field of the Rust target triple (arch-vendor-os-abi), not a
    # misconfiguration; `target` stays the triple because cargo and tauri need it.
    name: release (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: Windows arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # cmake/clang/libclang-dev/ninja-build build the whisper.cpp the
      # built-in local speech backend links, and generate its bindgen
      # bindings. The ubuntu-22.04 image already carries them; the
      # ubuntu-24.04-arm image does not, so both are named explicitly.
      - name: Install Linux system deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential xdg-utils unzip cmake clang libclang-dev ninja-build

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Compile macOS Liquid icon (Assets.car)
        if: startsWith(matrix.platform, 'macos')
        run: pnpm icon:mac-liquid

      - name: Build and stage monkey-cli sidecar
        run: pnpm stage:cli
        env:
          CLI_SIDECAR_TARGET: ${{ matrix.target }}

      - name: Verify and stage managed llama.cpp runtime
        run: pnpm stage:runtime
        env:
          MANAGED_RUNTIME_TARGET: ${{ matrix.target }}

      # Speech rides a second, newer llama.cpp pin so that reaching the
      # libmtmd llama-tts never moves the chat and embedding engine.
      - name: Verify and stage managed llama.cpp speech runtime
        run: pnpm stage:runtime:tts
        env:
          MANAGED_RUNTIME_TARGET: ${{ matrix.target }}

      # stable-diffusion.cpp publishes binaries for three of these six
      # targets. The script skips the rest by design, so Studio is simply
      # absent from those builds rather than failing them.
      - name: Verify and stage managed stable-diffusion.cpp runtime
        run: pnpm stage:runtime:sd
        env:
          MANAGED_RUNTIME_TARGET: ${{ matrix.target }}

      # tauri-action only imports APPLE_CERTIFICATE into a keychain during its
      # own bundling step, but codesign-managed-runtime.mjs runs earlier (in
      # beforeBuildCommand) and needs the Developer ID identity already
      # available — otherwise codesign fails with "no identity found".
      - name: Import Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANAGED_RUNTIME_TARGET: ${{ matrix.target }}
          CLI_SIDECAR_TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater artifacts (.app.tar.gz / .AppImage / -setup.exe)
          # and the `latest.json` manifest the in-app updater verifies against
          # `plugins.updater.pubkey`. Without these secrets tauri-action still
          # builds every installer, but emits no signatures and no manifest —
          # which is exactly why /releases/latest/download/latest.json 404s
          # today. See docs/auto-update.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: __VERSION__
          releaseName: 'Little Monkey v__VERSION__'
          releaseBody: |
            ## Install

            Download the asset for your platform below.

            - **macOS** — `.dmg` (`aarch64` for Apple silicon, `x64` for Intel)
            - **Windows** — `-setup.exe` or `_en-US.msi` (`arm64` or `x64`)
            - **Linux** — `.AppImage`, `.deb`, or `.rpm` (`aarch64`/`arm64` or `amd64`/`x86_64`)

            IDE clients are attached to this release as `little-monkey-vscode-1.0.0.vsix`
            and `little-monkey-jetbrains-1.0.0.zip`.

            Linux installers ship a detached signature. To check one:

            ```
            gpg --import little-monkey-release-key.asc
            gpg --verify <installer>.asc <installer>
            ```
          generateReleaseNotes: true
          # Draft only while the matrix runs. Six jobs write to one release, so
          # publishing here would expose a release carrying whichever platform
          # finished first — and an incomplete `latest.json` with it. The
          # `publish` job below flips it once every target has uploaded.
          releaseDraft: true
          prerelease: false
          # Attaches the signed `latest.json` the updater endpoint points at.
          # No-op when the signing secrets are missing (nothing to describe).
          includeUpdaterJson: true

      # The updater signature above only covers the .AppImage the in-app
      # updater downloads. Someone who grabs a .deb or .rpm from the releases
      # page has nothing to verify against, and Linux has no Gatekeeper to
      # verify it for them — so publish a detached GPG signature next to every
      # Linux installer, plus the public key to check them with.
      - name: GPG-sign the Linux installers
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Same contract as the updater secrets above: no key configured means
          # the release still ships, just unsigned. The `secrets` context is not
          # readable from a step-level `if`, so the guard lives here.
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG_PRIVATE_KEY unset — skipping installer signatures"
            exit 0
          fi
          # `gpg --import` exits 2 when it logs any error at all, including a
          # malformed armor header line, even when the key itself imported —
          # which is what this secret does: "invalid armor header", then
          # "secret keys imported: 1" in the same output. Under `set -e` that
          # killed the step after a successful import (release run for 1.3.0,
          # Linux arm64). The import's exit code cannot answer the question
          # this step needs answered, so ask the keyring instead: an empty
          # KEY_ID is the real failure and stays fatal.
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import || true
          KEY_ID="$({ gpg --list-secret-keys --with-colons || true; } | awk -F: '/^sec:/ {print $5; exit}')"
          if [ -z "$KEY_ID" ]; then
            echo "GPG_PRIVATE_KEY is set but no secret key was imported — refusing to ship unsigned installers"
            exit 1
          fi
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"

          # `find -print0` rather than a glob: no installer for a given format
          # is a normal outcome (the rpm bundler is skipped on some runners),
          # and an unmatched glob under `set -u` would fail the release.
          { find "$BUNDLE/deb" "$BUNDLE/rpm" "$BUNDLE/appimage" \
              -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
              -print0 2>/dev/null || true; } | while IFS= read -r -d '' installer; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$KEY_ID" --armor --detach-sign "$installer"
            gh release upload "$VERSION" "$installer.asc" --clobber
          done

          # Both Linux jobs upload the same key; --clobber makes the second a
          # no-op rather than a collision.
          gpg --armor --export "$KEY_ID" > little-monkey-release-key.asc
          gh release upload "$VERSION" little-monkey-release-key.asc --clobber

  ide-extensions:
    needs: release
    name: package IDE extensions
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test and package VS Code extension
        working-directory: extensions/little-monkey-vscode
        run: |
          npm test
          npx --yes @vscode/vsce@3.6.0 package --no-dependencies \
            --out "$GITHUB_WORKSPACE/little-monkey-vscode-1.0.0.vsix"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test and package JetBrains plugin
        working-directory: extensions/little-monkey-jetbrains
        run: |
          gradle test buildPlugin --no-daemon
          cp build/distributions/*.zip "$GITHUB_WORKSPACE/little-monkey-jetbrains-1.0.0.zip"

      - name: Attach IDE extension packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "$VERSION" \
            little-monkey-vscode-1.0.0.vsix \
            little-monkey-jetbrains-1.0.0.zip \
            --clobber

  # Installs what the matrix just built, on the platform it was built for
  # (roadmap K22). Between `release` and `publish` deliberately: a release that
  # cannot be installed must not be published, and a draft is still retractable.
  #
  # Every leg reports PASS, FAIL, or SKIPPED **with its reason** — a hosted
  # runner cannot exercise every installer, and the first release ever has
  # nothing to upgrade from, so "not covered here" is often the honest answer
  # and is said out loud in the job summary. Only a real failure is fatal;
  # failing a release because a leg was inapplicable would train everyone to
  # ignore this job.
  install-smoke:
    needs: release
    name: install smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
          - platform: ubuntu-22.04
            label: Linux
          - platform: windows-latest
            label: Windows

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download this release's installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p artifacts
          # A draft release's assets are only reachable with a token, which is
          # the whole reason this runs inside the workflow rather than against
          # the public download URL.
          gh release download "$VERSION" --dir artifacts --clobber || \
            echo "no assets downloaded for $VERSION — the smoke test will report SKIPPED with that reason"

      - name: Download the previous release's installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p previous
          # The newest published, non-draft release that is not this one. Absent
          # for the first release ever, which the upgrade leg reports as a skip
          # rather than treating as a pass.
          PREVIOUS="$(gh release list --limit 20 --json tagName,isDraft,isPrerelease \
            --jq "[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName] | map(select(. != \"$VERSION\")) | .[0] // empty")"
          if [ -z "$PREVIOUS" ]; then
            echo "PREVIOUS_VERSION=" >> "$GITHUB_ENV"
            echo "no previous release found — the upgrade leg will report SKIPPED with that reason"
            exit 0
          fi
          echo "PREVIOUS_VERSION=$PREVIOUS" >> "$GITHUB_ENV"
          gh release download "$PREVIOUS" --dir previous --clobber || \
            echo "the previous release ($PREVIOUS) published nothing downloadable"

      - name: Clean install and upgrade smoke test
        shell: bash
        run: |
          node scripts/install-smoke.mjs \
            --artifacts artifacts \
            --previous previous \
            --previous-version "${PREVIOUS_VERSION:-}"

  # Publishing is what makes the release real: GitHub serves no draft assets,
  # so until this runs `/releases/latest/download/latest.json` 404s and no
  # installed app sees the update. It needs the whole matrix, so a target that
  # failed leaves the release a draft rather than shipping a partial one.
  publish:
    # Waits on the smoke test too: a release that cannot be installed must not
    # be published. A skipped leg does not block — it is reported, not fatal.
    needs: [release, install-smoke, ide-extensions]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Ships the bill of materials with the thing it describes: a release
      # asset, not a CI artifact that expires. Runs before the publish so a
      # published release never lacks it.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: little-monkey-sbom.cyclonedx.json
          output-file: little-monkey-sbom.cyclonedx.json

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "$VERSION" little-monkey-sbom.cyclonedx.json --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          # --latest is explicit rather than implied: the updater endpoint
          # resolves through /releases/latest, and a draft published later
          # than a newer tag would otherwise not claim it.
          gh release edit "$VERSION" --draft=false --latest
          gh release view "$VERSION" --json isDraft,tagName,assets \
            --jq '"published \(.tagName) with \(.assets | length) assets"'
