name: Local Whisper

on:
  pull_request:
    paths:
      - '.cargo/config.toml'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/local_whisper.rs'
      - 'src-tauri/src/m7_companion.rs'
      - 'src-tauri/src/lib.rs'
      - 'src/components/Talk/**'
      - 'src/components/Settings/CompanionPanel*'
      - 'src/lib/companionClient.ts'
      - '.github/workflows/local-whisper.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main, develop]
    paths:
      - '.cargo/config.toml'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/src/local_whisper.rs'
      - 'src-tauri/src/m7_companion.rs'
      - 'src-tauri/src/lib.rs'
      - '.github/workflows/local-whisper.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  compile-all-release-targets:
    name: compile (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: Windows arm64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake clang ninja-build
      - name: Verify Windows ARM64 native toolchain
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          clang-cl --version
          ninja --version
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: local-whisper-${{ matrix.target }}
      - name: Compile Little Monkey with built-in Whisper
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

  real-transcription:
    name: real WAV + browser WebM/Opus transcription
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install build and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake clang ninja-build ffmpeg
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: local-whisper-e2e
      - name: Prepare immutable speech fixtures
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/ggerganov/whisper.cpp/2eeeba56e9edd762b4b38467bab96c2517163158/samples/jfk.wav \
            --output "$RUNNER_TEMP/jfk.wav"
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/jfk.wav" -c:a libopus "$RUNNER_TEMP/jfk.webm"
          echo "LITTLE_MONKEY_LOCAL_WHISPER_E2E_WAV=$RUNNER_TEMP/jfk.wav" >> "$GITHUB_ENV"
          echo "LITTLE_MONKEY_LOCAL_WHISPER_E2E_WEBM=$RUNNER_TEMP/jfk.webm" >> "$GITHUB_ENV"
      - name: Auto-provision model and transcribe both production formats
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib local_whisper::tests::e2e_auto_provisions_and_transcribes_real_audio -- --nocapture
