name: Signal installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/signal_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/signal.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/**"
      - "src-tauri/src/bin/monkey-cli/channels_cli.rs"
      - ".github/workflows/signal-installed-service-e2e.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile real-account acceptance harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libdbus-1-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: signal-installed-service

      - name: Compile black-box Signal harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example signal_installed_service_e2e

      - name: Explain why hosted CI does not send Signal messages
        run: |
          cat <<'EOF'
          The harness is intentionally compiled, not executed, on GitHub-hosted runners.
          A literal Signal run needs two pre-registered real Signal identities and their
          local signal-cli account stores. Registration requires an operator-controlled
          phone/linked device; manufacturing or uploading those credentials in PR CI
          would weaken the very production boundary this acceptance is meant to prove.
          Run the documented example on a machine that owns two disposable accounts.
          EOF
