name: Voice Everywhere Work

on:
  push:
    branches:
      - feat/voice-everywhere
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: voice-everywhere-source
          path: .
          include-hidden-files: true
          retention-days: 1
