name: PR 452 CI repair

on:
  push:
    branches:
      - fix/zero-config-whisper
    paths:
      - .github/workflows/pr452-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-config-whisper
          fetch-depth: 0

      - name: Apply deterministic cross-platform process fixtures
        shell: python
        run: |
          from pathlib import Path

          verify = Path("src-tauri/src/verify.rs")
          text = verify.read_text()
          old = 'command("c1", "sleep 30")'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f"expected 4 hard-coded long-running verify fixtures, found {count}")
          text = text.replace(old, 'command("c1", &long_running_command())')
          verify.write_text(text)

          skill = Path("src-tauri/src/skill_learning.rs")
          text = skill.read_text()
          old_read = '            command: "test -f src/uploader.rs".to_string(),'
          new_read = '''            command: if cfg!(target_os = "windows") {
              r#"if exist src\\uploader.rs (exit /b 0) else (exit /b 1)"#.to_string()
            } else {
              "test -f src/uploader.rs".to_string()
            },'''
          if text.count(old_read) != 1:
              raise SystemExit(f"expected one read-only verification fixture, found {text.count(old_read)}")
          text = text.replace(old_read, new_read)

          old_grep = '            command: "grep -q \'with_retry(\' src/uploader.rs".to_string(),'
          new_grep = '''            command: if cfg!(target_os = "windows") {
              r#"findstr /C:\"with_retry(\" src\\uploader.rs >nul"#.to_string()
            } else {
              "grep -q 'with_retry(' src/uploader.rs".to_string()
            },'''
          if text.count(old_grep) != 1:
              raise SystemExit(f"expected one grep verification fixture, found {text.count(old_grep)}")
          text = text.replace(old_grep, new_grep)
          skill.write_text(text)

          resource = Path("src-tauri/src/resource_control.rs")
          text = resource.read_text()
          start = 'fn a_failing_ledger_does_not_end_a_workload_that_owns_nothing_new() {'
          end = '\n    /// A pid that has been reused'
          if text.count(start) != 1:
              raise SystemExit(f"expected one no-new-ownership test, found {text.count(start)}")
          before, scoped = text.split(start, 1)
          if end not in scoped:
              raise SystemExit("could not find end of no-new-ownership test")
          body, after = scoped.split(end, 1)

          replacements = [
              ('Command::new("sh")', 'Command::new("sleep")'),
              ('.arg("-c")\n            .arg("sleep 5")', '.arg("5")'),
              ('expect("the shell starts")', 'expect("sleep starts")'),
              ('expect("the shell has an identity")', 'expect("sleep has an identity")'),
              ('expect("the shell attaches")', 'expect("sleep attaches")'),
          ]
          for old_fragment, new_fragment in replacements:
              count = body.count(old_fragment)
              if count != 1:
                  raise SystemExit(f"expected one scoped fragment {old_fragment!r}, found {count}")
              body = body.replace(old_fragment, new_fragment, 1)

          text = before + start + body + end + after
          resource.write_text(text)

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/pr452-ci-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/verify.rs src-tauri/src/skill_learning.rs src-tauri/src/resource_control.rs .github/workflows/pr452-ci-repair.yml
          git diff --cached --check
          git commit -m "test: stabilize cross-platform process fixtures"
          git push origin HEAD:fix/zero-config-whisper
