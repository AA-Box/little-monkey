name: Repair Windows verification fixtures once

on:
  push:
    branches:
      - fix/zero-config-whisper
    paths:
      - .github/workflows/fix-windows-ci-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-config-whisper
          fetch-depth: 0

      - name: Patch Windows-only verification fixtures
        shell: python
        run: |
          from pathlib import Path

          verify = Path("src-tauri/src/verify.rs")
          text = verify.read_text()
          old = "powershell.exe -NoLogo -NoProfile -NonInteractive -Command Start-Sleep -Seconds 30"
          new = "ping -n 31 127.0.0.1 > nul"
          if text.count(old) != 1:
              raise SystemExit(f"expected one PowerShell sleeper, found {text.count(old)}")
          verify.write_text(text.replace(old, new, 1))

          learning = Path("src-tauri/src/skill_learning.rs")
          text = learning.read_text()
          old = r'''r#"if exist "src\uploader.rs" (exit /b 0) else (exit /b 1)"#'''
          new = r'''r#"if exist src\uploader.rs (exit /b 0) else (exit /b 1)"#'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one quoted Windows existence check, found {text.count(old)}")
          learning.write_text(text.replace(old, new, 1))

          Path(".github/workflows/fix-windows-ci-once.yml").unlink()

      - name: Validate and commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src-tauri/src/verify.rs src-tauri/src/skill_learning.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: fix Windows verification commands"
          git push origin HEAD:fix/zero-config-whisper
