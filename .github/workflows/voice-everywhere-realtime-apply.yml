name: Apply Realtime Voice Everywhere patch

on:
  push:
    branches:
      - feat/voice-everywhere

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "fix: trigger realtime bridge apply" ]; then
            exit 0
          fi
          cat .voice-everywhere-realtime/part* > /tmp/voice-everywhere-realtime.patch
          echo "106c594d251180bf75f9623f0aa89fe134d2f32b2a9e2e08602096b6d67b4a5b  /tmp/voice-everywhere-realtime.patch" | sha256sum -c -
          git apply --check /tmp/voice-everywhere-realtime.patch
          git apply --index /tmp/voice-everywhere-realtime.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(voice): bridge paired devices into Realtime"
          git push origin HEAD:feat/voice-everywhere
