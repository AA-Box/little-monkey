name: Standards Studio finalizer

on:
  push:
    branches:
      - feat/standards-studio

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standards-studio
          fetch-depth: 0
      - name: Apply final wiring
        run: python3 scripts/standards-studio-finalize.py
      - name: Format and validate patch
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit final wiring
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agentLoop.ts src/lib/daemonDesktopTurn.ts src-tauri/src/recipes.rs src-tauri/src/bin/monkey-cli/agent.rs src-tauri/src/bin/monkey-cli/task.rs docs/standards-studio.md
          git commit -m "fix: enforce Standards across all execution paths"
          git push origin HEAD:feat/standards-studio
