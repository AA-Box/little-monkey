name: Standards Studio finalizer

on:
  push:
    branches:
      - feat/standards-studio

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standards-studio
          fetch-depth: 0
      - name: Fix Rust verification messages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/bin/monkey-cli/agent.rs')
          s = p.read_text()
          s = s.replace('''        statusln!(\n            options,\n            "\n[verify] running \\\"{}\\\"…",\n            cmd.label\n        );''', '''        statusln!(options, "\\n[verify] running \\\"{}\\\"…", cmd.label);''')
          s = s.replace('''                        let message = format!(\n                            "{VERIFY_NOTE_PREFIX} The verification command "{}" failed (exit {code_display}). Fix the reported problems, then stop.\n                        {}",\n                            failure.label, protected_output\n                        );\n                        statusln!(\n                            options,\n                            "\n{message}"\n                        );''', '''                        let message = format!(\n                            "{VERIFY_NOTE_PREFIX} The verification command \\\"{}\\\" failed (exit {code_display}). Fix the reported problems, then stop.\\n{}",\n                            failure.label, protected_output\n                        );\n                        statusln!(options, "\\n{message}");''')
          s = s.replace('''                        let message = format!(\n                            "Completion blocked: required Standards verification "{}" did not pass (exit {code_display}). {}",\n                            failure.label, failure.output\n                        );\n                        statusln!(\n                            options,\n                            "\n{message}"\n                        );''', '''                        let message = format!(\n                            "Completion blocked: required Standards verification \\\"{}\\\" did not pass (exit {code_display}). {}",\n                            failure.label, failure.output\n                        );\n                        statusln!(options, "\\n{message}");''')
          if 'verification command "{}" failed' in s or 'Standards verification "{}" did not pass' in s:
              raise SystemExit('malformed Rust verification quote remained')
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Compile monkey-cli
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin monkey-cli
      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/bin/monkey-cli/agent.rs
          if git diff --cached --quiet; then
            echo "No source correction required"
            exit 0
          fi
          git commit -m "fix: correct Standards verification failure messages"
          git push origin HEAD:feat/standards-studio
