name: Standards Studio finalizer

on:
  push:
    branches:
      - feat/standards-studio

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standards-studio
          fetch-depth: 0
      - name: Relax source matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/standards-studio-finalize.py')
          s = p.read_text()

          old = 'body_chunk = replace_once(body_chunk, old_verify_exit, new_verify_exit, "normal verification completion gate")'
          new = '''verify_exit_pattern = re.compile(r"      if \\(!signal\\?\\.aborted && mutatedFiles\\.size > 0\\) \\{[\\s\\S]*?\\n      \\}\\n      return;", re.M)\nreplacement = new_verify_exit + "      return;"\nbody_chunk, matched = verify_exit_pattern.subn(replacement, body_chunk, count=1)\nif matched != 1:\n    raise SystemExit(f"normal verification completion gate matched {matched} times")'''
          if old not in s:
              raise SystemExit('frontend matcher patch target missing')
          s = s.replace(old, new, 1)

          old = 's = replace_once(s, old_rust_exit, new_rust_exit, "Rust verification completion gate")'
          new = '''rust_exit_pattern = re.compile(r"            if options\\.verify && !mutated_files\\.is_empty\\(\\) \\{[\\s\\S]*?\\n            \\}\\n\\n            return Ok\\(\\(\\)\\);", re.M)\nrust_replacement = new_rust_exit + "\\n            return Ok(());"\ns, matched = rust_exit_pattern.subn(rust_replacement, s, count=1)\nif matched != 1:\n    raise SystemExit(f"Rust verification completion gate matched {matched} times")'''
          if old not in s:
              raise SystemExit('Rust matcher patch target missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply final wiring
        run: python3 scripts/standards-studio-finalize.py
      - name: Format and validate patch
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit final wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agentLoop.ts src/lib/daemonDesktopTurn.ts src-tauri/src/recipes.rs src-tauri/src/bin/monkey-cli/agent.rs src-tauri/src/bin/monkey-cli/task.rs docs/standards-studio.md
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "fix: enforce Standards across all execution paths"
          git push origin HEAD:feat/standards-studio
