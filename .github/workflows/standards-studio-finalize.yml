name: Standards Studio finalizer

on:
  push:
    branches:
      - feat/standards-studio

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standards-studio
          fetch-depth: 0
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - name: Fix Rust verification messages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/bin/monkey-cli/agent.rs')
          s = p.read_text()
          old1 = '''        statusln!(
            options,
            "
[verify] running \\\"{}\\\"…",
            cmd.label
        );'''
          new1 = '''        statusln!(options, "\\n[verify] running \\\"{}\\\"…", cmd.label);'''
          old2 = '''                        let message = format!(
                            "{VERIFY_NOTE_PREFIX} The verification command "{}" failed (exit {code_display}). Fix the reported problems, then stop.
                        {}",
                            failure.label, protected_output
                        );
                        statusln!(
                            options,
                            "
{message}"
                        );'''
          new2 = '''                        let message = format!(
                            "{VERIFY_NOTE_PREFIX} The verification command \\\"{}\\\" failed (exit {code_display}). Fix the reported problems, then stop.\\n{}",
                            failure.label, protected_output
                        );
                        statusln!(options, "\\n{message}");'''
          old3 = '''                        let message = format!(
                            "Completion blocked: required Standards verification "{}" did not pass (exit {code_display}). {}",
                            failure.label, failure.output
                        );
                        statusln!(
                            options,
                            "
{message}"
                        );'''
          new3 = '''                        let message = format!(
                            "Completion blocked: required Standards verification \\\"{}\\\" did not pass (exit {code_display}). {}",
                            failure.label, failure.output
                        );
                        statusln!(options, "\\n{message}");'''
          for label, old, new in [('status', old1, new1), ('feedback', old2, new2), ('gate', old3, new3)]:
              if old not in s:
                  raise SystemExit(f'missing Rust correction target: {label}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Compile monkey-cli
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin monkey-cli
      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/bin/monkey-cli/agent.rs
          git commit -m "fix: correct Standards verification failure messages"
          git push origin HEAD:feat/standards-studio
