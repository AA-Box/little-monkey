name: Standards Studio finalizer

on:
  push:
    branches:
      - feat/standards-studio

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standards-studio
          fetch-depth: 0
      - name: Fix Rust verification messages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/bin/monkey-cli/agent.rs')
          s = p.read_text()
          fixes = [
              ('status', '        statusln!(\n            options,\n            "\n[verify] running \\\"{}\\\"…",\n            cmd.label\n        );', '        statusln!(options, "\\n[verify] running \\\"{}\\\"…", cmd.label);'),
              ('feedback', '                        let message = format!(\n                            "{VERIFY_NOTE_PREFIX} The verification command "{}" failed (exit {code_display}). Fix the reported problems, then stop.\n                        {}",\n                            failure.label, protected_output\n                        );\n                        statusln!(\n                            options,\n                            "\n{message}"\n                        );', '                        let message = format!(\n                            "{VERIFY_NOTE_PREFIX} The verification command \\\"{}\\\" failed (exit {code_display}). Fix the reported problems, then stop.\\n{}",\n                            failure.label, protected_output\n                        );\n                        statusln!(options, "\\n{message}");'),
              ('gate', '                        let message = format!(\n                            "Completion blocked: required Standards verification "{}" did not pass (exit {code_display}). {}",\n                            failure.label, failure.output\n                        );\n                        statusln!(\n                            options,\n                            "\n{message}"\n                        );', '                        let message = format!(\n                            "Completion blocked: required Standards verification \\\"{}\\\" did not pass (exit {code_display}). {}",\n                            failure.label, failure.output\n                        );\n                        statusln!(options, "\\n{message}");'),
          ]
          for label, old, new in fixes:
              if old not in s:
                  raise SystemExit(f'missing Rust correction target: {label}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit correction and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/bin/monkey-cli/agent.rs
          git rm .github/workflows/standards-studio-finalize.yml scripts/standards-studio-finalize.py
          git commit -m "fix: repair Standards verification build"
          git push origin HEAD:feat/standards-studio
