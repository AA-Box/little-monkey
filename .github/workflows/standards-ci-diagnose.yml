name: Standards CI repair

on:
  push:
    branches:
      - feat/standards-studio

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/standards-studio
          fetch-depth: 0
      - name: Apply compatibility patch
        run: |
          python3 scripts/standards-ci-fix.py
          git diff --check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate affected frontend contracts
        run: |
          pnpm exec vitest run src/lib/agentLoop.test.ts src/lib/standards.test.ts src/lib/verificationPlan.test.ts src/lib/daemonDesktopTurn.test.ts
          pnpm typecheck
      - name: Commit fix and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agentLoop.ts
          git rm .github/workflows/standards-ci-diagnose.yml scripts/standards-ci-fix.py ci-vitest-failure.txt
          git commit -m "fix: preserve verification failure compatibility"
          git push origin HEAD:feat/standards-studio
