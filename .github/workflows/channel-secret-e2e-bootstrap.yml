name: Bootstrap channel secure-store E2E

on:
  push:
    branches:
      - fix/channel-secret-daemon-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/channel-secret-daemon-ownership
          fetch-depth: 0
      - name: Apply production and E2E changes
        run: python .github/scripts/apply-channel-secret-e2e.py
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential dbus-x11 gnome-keyring libdbus-1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Stage CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Format and compile
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check
          cargo check --manifest-path src-tauri/Cargo.toml --bin monkey-cli --tests
      - name: Run native secure-store E2E on Linux
        env:
          LITTLE_MONKEY_REQUIRE_CHANNEL_SECURE_STORE_E2E: '1'
        run: |
          dbus-run-session -- bash -lc '
            unset GNOME_KEYRING_CONTROL
            eval "$(printf "\\n" | gnome-keyring-daemon --unlock --replace --components=secrets)"
            cargo test --manifest-path src-tauri/Cargo.toml --test channel_secure_store_e2e -- --nocapture
          '
      - name: Commit verified implementation
        run: |
          rm .github/workflows/channel-secret-e2e-bootstrap.yml .github/scripts/apply-channel-secret-e2e.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(channels): prove native secure-store handoff end to end'
          git push origin HEAD:fix/channel-secret-daemon-ownership
