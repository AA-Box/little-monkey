name: Native VDN contracts

# Read-only checkout and no token writes are required.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "scripts/studio-vdn-h3-worker.py"
      - "scripts/studio_vdn_sampler.py"
      - "scripts/studio_vdn_temporal.py"
      - "scripts/studio_vdn_temporal_store.py"
      - "scripts/studio_vdn_chain.py"
      - "scripts/studio-vdn-fast-worker.py"
      - "src-tauri/src/studio_vdn.rs"
      - "src-tauri/src/studio_vdn_jobs.rs"
      - "src/components/Studio/StudioVdnPanel.tsx"
      - "src/lib/studioClient.ts"
      - "tests/test_studio_vdn_*.py"
      - ".github/workflows/vdn-native-check.yml"

jobs:
  native-worker-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check owned Python workers
        run: |
          python3 -m py_compile scripts/studio-vdn-h3-worker.py scripts/studio-vdn-fast-worker.py scripts/studio_vdn_sampler.py scripts/studio_vdn_temporal.py scripts/studio_vdn_temporal_store.py scripts/studio_vdn_chain.py
          python3 - <<'PY'
          from pathlib import Path
          scripts = ("studio_vdn_sampler.py", "studio_vdn_temporal_store.py",
                     "studio_vdn_chain.py", "studio_vdn_temporal.py", "studio-vdn-h3-worker.py")
          sources = [Path("scripts", p).read_text() for p in scripts]
          compile("\n".join(sources), "staged-vdn-worker.py", "exec")
          PY
      - name: Run actual worker subprocess input contracts
        run: python3 scripts/test-studio-vdn-h3-worker.py
      - name: Native policy, media pinning and latent checkpoint contracts
        run: |
          python3 -m unittest discover -s tests -p "test_studio_vdn_memory.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_native_contract.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_sampler.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_temporal.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_temporal_store.py"

  native-av-tensor-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded CPU tensor dependencies (no GPU / model weights)
        run: |
          python -m pip install "numpy>=1.24,<3" "safetensors>=0.5,<1" "av>=12,<18"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
      - name: Run real CPU AV snapshot and mocked full two-pass/continuation contracts
        run: |
          python -m unittest discover -s tests -p "test_studio_vdn_temporal_store.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_chain.py" -v
