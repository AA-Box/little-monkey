name: Native VDN contracts

# Read-only checkout and no token writes are required.
permissions:
  contents: read

on:
  push:
    paths:
      - "scripts/studio-vdn-h3-worker.py"
      - "scripts/studio_vdn_*.py"
      - "tests/test_studio_vdn_*.py"
      - ".github/workflows/vdn-native-check.yml"
  pull_request:
    paths:
      - "scripts/studio-vdn-h3-worker.py"
      - "scripts/studio_vdn_sampler.py"
      - "scripts/studio_vdn_temporal.py"
      - "scripts/studio_vdn_temporal_store.py"
      - "scripts/studio_vdn_chain.py"
      - "scripts/studio_vdn_segment_cache.py"
      - "scripts/studio_vdn_identity.py"
      - "scripts/studio_vdn_learned_upscaler.py"
      - "licenses/h3-latent-upscaler-MIT.txt"
      - "scripts/studio_vdn_lowmem.py"
      - "scripts/studio_vdn_disk_loader.py"
      - "scripts/studio_vdn_decoder.py"
      - "scripts/studio_vdn_stream_encode.py"
      - "scripts/studio_vdn_native_shards.py"
      - "scripts/studio-vdn-fast-worker.py"
      - "src-tauri/src/studio_vdn.rs"
      - "src-tauri/src/studio_vdn_jobs.rs"
      - "src/components/Studio/StudioVdnPanel.tsx"
      - "src/lib/studioClient.ts"
      - "tests/test_studio_vdn_*.py"
      - ".github/workflows/vdn-native-check.yml"

jobs:
  native-worker-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check owned Python workers
        run: |
          python3 -m py_compile scripts/studio-vdn-h3-worker.py scripts/studio-vdn-fast-worker.py scripts/studio_vdn_sampler.py scripts/studio_vdn_temporal.py scripts/studio_vdn_temporal_store.py scripts/studio_vdn_chain.py scripts/studio_vdn_segment_cache.py scripts/studio_vdn_identity.py scripts/studio_vdn_lowmem.py scripts/studio_vdn_disk_loader.py scripts/studio_vdn_native_shards.py scripts/studio_vdn_decoder.py scripts/studio_vdn_learned_upscaler.py scripts/studio_vdn_stream_encode.py
          python3 - <<'PY'
          from pathlib import Path
          native = Path("scripts/studio_vdn_sampler.py").read_text()
          lowmem = Path("scripts/studio_vdn_lowmem.py").read_text()
          disk_loader = Path("scripts/studio_vdn_disk_loader.py").read_text()
          original_shards = Path("scripts/studio_vdn_native_shards.py").read_text()
          decoder = Path("scripts/studio_vdn_decoder.py").read_text()
          stream_mp4 = Path("scripts/studio_vdn_stream_encode.py").read_text()
          temporal_store = Path("scripts/studio_vdn_temporal_store.py").read_text()
          chain = Path("scripts/studio_vdn_chain.py").read_text()
          identity = Path("scripts/studio_vdn_identity.py").read_text()
          segment_cache = Path("scripts/studio_vdn_segment_cache.py").read_text()
          temporal = Path("scripts/studio_vdn_temporal.py").read_text()
          upscaler = Path("scripts/studio_vdn_learned_upscaler.py").read_text()
          worker = Path("scripts/studio-vdn-h3-worker.py").read_text()
          compile(native + "\n" + lowmem + "\n" + disk_loader + "\n" + original_shards + "\n" + decoder + "\n" + stream_mp4 + "\n" + upscaler + "\n" + temporal_store + "\n" + chain + "\n" + segment_cache + "\n" + identity + "\n" + temporal + "\n" + worker, "staged-vdn-worker.py", "exec")
          PY
      - name: Run actual worker subprocess input contracts
        run: python3 scripts/test-studio-vdn-h3-worker.py
      - name: Native policy, media pinning and latent checkpoint contracts
        run: |
          python3 -m unittest discover -s tests -p "test_studio_vdn_memory.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_native_contract.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_sampler.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_lowmem.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_disk_loader.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_learned_upscaler.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_temporal.py"
          python3 -m unittest discover -s tests -p "test_studio_vdn_temporal_store.py"

  native-lowmem-torch-cpu-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch CPU kernel without downloading model weights
        run: |
          python -m pip install --disable-pip-version-check "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "accelerate>=1.8,<2" safetensors "av>=15,<17" numpy
      - name: Real full-context attention projection and FFN parity
        run: |
          python -m unittest discover -s tests -p "test_studio_vdn_lowmem_torch.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_disk_loader_accelerate.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_native_shards.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_decoder.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_stream_encode.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_mp4_probe.py" -v

  native-av-tensor-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded CPU tensor dependencies (no GPU / model weights)
        run: |
          python -m pip install "numpy>=1.24,<3" "safetensors>=0.5,<1" "av>=12,<18" "Pillow>=10,<13"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
      - name: Run real CPU AV snapshot and mocked full two-pass/continuation contracts
        run: |
          python -m unittest discover -s tests -p "test_studio_vdn_temporal_store.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_chain.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_segment_cache.py" -v
          python -m unittest discover -s tests -p "test_studio_vdn_identity.py" -v
