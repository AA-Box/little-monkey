name: Native swarm live acceptance (operator owned machines)

# This workflow is intentionally never triggered by pull_request or push.
# It runs real models and talks to a separately configured paired installation.
# The operator must review the selected branch and both machines first.
on:
  workflow_dispatch:
    inputs:
      sender_runner:
        description: Runner label of the prepared sending installation
        required: true
        type: choice
        options:
          - swarm-node-a
          - swarm-node-b
      peer_alias:
        description: Explicitly paired read-only receiving installation alias
        required: true
        type: string
      model_targets:
        description: Comma-separated configured target inventory keys for real model benchmarks
        required: true
        type: string
      specialist_target:
        description: Optional installed Ollama target for real specialist source-fixture verification
        required: false
        default: ''
        type: string
      specialist_domain:
        description: Domain to evaluate against independently graded source fixtures
        required: true
        default: security
        type: choice
        options:
          - security
          - frontend
          - backend
          - performance
          - general
      repair_target:
        description: Optional installed Ollama target for real permission-gated repository repair (operator MUST approve every write)
        required: false
        default: ''
        type: string
      expected_evidence:
        description: Optional source filename expected in the actual peer report
        required: false
        default: README
        type: string
      memory_namespace:
        description: Disposable pre-granted lm-e2e- namespace (empty skips memory acceptance)
        required: false
        default: ''
        type: string
      receiver_memory_record:
        description: Receiver-authored record ID already seeded in this test namespace
        required: false
        default: ''
        type: string
      fallback_graph_id:
        description: Optional already-running disposable resident graph whose primary read-only root was captured before failing
        required: false
        default: ''
        type: string
      fallback_root_id:
        description: Root node ID whose preapproved PLAN fallback must complete
        required: false
        default: ''
        type: string
      fallback_receipt_path:
        description: Absolute path to pre-captured protected fallback receipt on this persistent self-hosted runner
        required: false
        default: ''
        type: string
      verify_remote_cancellation:
        description: Run a disposable remote task and verify actual cancellation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-swarm-live-${{ inputs.sender_runner }}
  cancel-in-progress: false

jobs:
  live-two-node-models:
    name: Real model and peer acceptance
    runs-on: [self-hosted, swarm-acceptance, "${{ inputs.sender_runner }}"]
    timeout-minutes: 90
    env:
      PEER_ALIAS: ${{ inputs.peer_alias }}
      MODEL_TARGETS: ${{ inputs.model_targets }}
      EXPECT_EVIDENCE: ${{ inputs.expected_evidence }}
      LITTLE_MONKEY_KEEP_EVAL_REPO: "0"
    steps:
      - name: Checkout the reviewed Little Monkey branch
        uses: actions/checkout@v4
      - name: Verify actual operator-installed runtime and pairing
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          command -v git
          command -v monkey
          monkey --version
          node --check scripts/swarm-two-peer-live-acceptance.mjs
          node --check scripts/swarm-model-benchmark.mjs
          node --check scripts/swarm-specialist-live-benchmark.mjs
          node --check scripts/swarm-resident-restart-live-acceptance.mjs
          node --check scripts/swarm-resident-fallback-live-acceptance.mjs
          node scripts/swarm-resident-fallback-live-acceptance.mjs --self-check
          node --check scripts/swarm-repository-repair-live-acceptance.mjs
          node scripts/swarm-repository-repair-live-acceptance.mjs --self-check
          node scripts/swarm-specialist-live-benchmark.mjs --self-check --domain all
          node --test scripts/swarm-specialist-oracle.contract.test.mjs
          node --check scripts/swarm-two-peer-memory-live-acceptance.mjs
          node --check scripts/swarm-two-peer-cancellation-live-acceptance.mjs
          node --test scripts/swarm-two-peer-acceptance.contract.test.mjs scripts/swarm-two-peer-memory-acceptance.contract.test.mjs scripts/swarm-two-peer-cancellation-acceptance.contract.test.mjs
      - name: Exercise actual signed, pinned-TLS peer work and completed result
        shell: bash
        run: |
          set -euo pipefail
          node scripts/swarm-two-peer-live-acceptance.mjs \
            --peer "$PEER_ALIAS" --expect "$EXPECT_EVIDENCE" \
            --timeout-seconds 600 --poll-seconds 5 \
            > "$RUNNER_TEMP/native-swarm-peer-acceptance.json"
      - name: Measure actual model behavior against independent test fixtures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/swarm-model-benchmark.mjs \
            --targets "$MODEL_TARGETS" --repetitions 3 \
            > "$RUNNER_TEMP/native-swarm-real-model-benchmark.json"
      # The following operations never run on PRs or ordinary pushes and
      # never enable capabilities on either node. Explicitly seeded data only.
      - name: Verify real peer vector replication, convergence and tombstones
        if: ${{ inputs.memory_namespace != '' && inputs.receiver_memory_record != '' }}
        shell: bash
        env:
          MEMORY_NS: ${{ inputs.memory_namespace }}
          MEMORY_RECEIVER_ID: ${{ inputs.receiver_memory_record }}
        run: |
          set -euo pipefail
          node scripts/swarm-two-peer-memory-live-acceptance.mjs \
            --peer "$PEER_ALIAS" --namespace "$MEMORY_NS" \
            --receiver-record "$MEMORY_RECEIVER_ID" --confirm-disposable \
            > "$RUNNER_TEMP/native-swarm-vector-memory-acceptance.json"
      - name: Verify real authorized remote cancellation reaches terminal state
        if: ${{ inputs.verify_remote_cancellation }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/swarm-two-peer-cancellation-live-acceptance.mjs \
            --peer "$PEER_ALIAS" --confirm-disposable \
            --timeout-seconds 300 --poll-seconds 5 \
            > "$RUNNER_TEMP/native-swarm-cancellation-acceptance.json"
      - name: Run genuine installed-model specialist source quality evaluation
        if: ${{ inputs.specialist_target != '' }}
        shell: bash
        env:
          SPECIALIST_TARGET: ${{ inputs.specialist_target }}
          SPECIALIST_DOMAIN: ${{ inputs.specialist_domain }}
        run: |
          set -euo pipefail
          node scripts/swarm-specialist-live-benchmark.mjs \
            --domain "$SPECIALIST_DOMAIN" \
            --target "$SPECIALIST_TARGET" --repetitions 3 \
            > "$RUNNER_TEMP/native-swarm-specialist-quality.json"
      - name: Real vulnerability discovery, manual repair and external regression tests
        if: ${{ inputs.repair_target != '' }}
        shell: bash
        env:
          REPAIR_TARGET: ${{ inputs.repair_target }}
        run: |
          set -euo pipefail
          node scripts/swarm-repository-repair-live-acceptance.mjs \
            --target "$REPAIR_TARGET" --confirm-manual-approvals \
            --timeout-seconds 2400 \
            > "$RUNNER_TEMP/native-swarm-repository-repair.json"
      - name: Verify installed daemon re-elects a preapproved read-only fallback
        if: ${{ inputs.fallback_graph_id != '' || inputs.fallback_root_id != '' || inputs.fallback_receipt_path != '' }}
        shell: bash
        env:
          FALLBACK_GRAPH: ${{ inputs.fallback_graph_id }}
          FALLBACK_ROOT: ${{ inputs.fallback_root_id }}
          FALLBACK_RECEIPT: ${{ inputs.fallback_receipt_path }}
        run: |
          set -euo pipefail
          test -n "$FALLBACK_GRAPH" && test -n "$FALLBACK_ROOT" && test -n "$FALLBACK_RECEIPT"
          node scripts/swarm-resident-fallback-live-acceptance.mjs \
            --phase verify --graph "$FALLBACK_GRAPH" --root "$FALLBACK_ROOT" \
            --checkpoint "$FALLBACK_RECEIPT" --confirm-disposable \
            > "$RUNNER_TEMP/native-swarm-resident-fallback-acceptance.json"
      - name: Publish real-run verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-swarm-acceptance-${{ inputs.sender_runner }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/native-swarm-peer-acceptance.json
            ${{ runner.temp }}/native-swarm-real-model-benchmark.json
            ${{ runner.temp }}/native-swarm-vector-memory-acceptance.json
            ${{ runner.temp }}/native-swarm-cancellation-acceptance.json
            ${{ runner.temp }}/native-swarm-specialist-quality.json
            ${{ runner.temp }}/native-swarm-repository-repair.json
            ${{ runner.temp }}/native-swarm-resident-fallback-acceptance.json
