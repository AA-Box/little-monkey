name: Voice Everywhere current snapshot

permissions:
  contents: read

on:
  push:
    branches:
      - feat/voice-everywhere

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/upload-artifact@v4
        with:
          name: little-monkey-voice-everywhere-current
          path: .
          include-hidden-files: true
          retention-days: 1
