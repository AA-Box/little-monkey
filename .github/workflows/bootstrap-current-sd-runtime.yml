name: Bootstrap current SD runtime pin

on:
  push:
    branches:
      - feat/auto-update-sd-runtime
    paths:
      - ".github/workflows/bootstrap-current-sd-runtime.yml"

permissions:
  contents: write

jobs:
  apply-current-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auto-update-sd-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply the updater to this integration branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_JSON: ${{ runner.temp }}/sd-runtime-bootstrap.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-managed-sd-runtime.mjs --apply > "$UPDATE_JSON"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.env.UPDATE_JSON, "utf8"));
          if (result.changed !== true) {
            throw new Error(`bootstrap expected an update, got: ${JSON.stringify(result)}`);
          }
          console.log(`Bootstrapping ${result.version} at ${result.commit}`);
          NODE

      - name: Validate and commit the generated pin
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/update-managed-sd-runtime.test.mjs scripts/lib/managedRuntimeManifest.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/lib/managedRuntimeManifest.mjs \
            scripts/lib/managedRuntimeManifest.test.mjs \
            src-tauri/build.rs \
            src-tauri/src/managed_runtime.rs
          git diff --cached --quiet && { echo "Updater produced no pin diff" >&2; exit 1; }
          git commit -m "chore(runtime): update stable-diffusion.cpp to current release"
          git push origin HEAD:feat/auto-update-sd-runtime
