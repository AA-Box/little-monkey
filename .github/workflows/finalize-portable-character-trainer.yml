name: Portable Character Studio integration

on:
  push:
    branches:
      - feature/lu-parity-media-imports
    paths:
      - .github/workflows/finalize-portable-character-trainer.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lu-parity-media-imports
          fetch-depth: 0

      - name: Apply integration patch
        run: |
          python3 .github/scripts/finalize-portable-character-trainer.py
          rustfmt --edition 2021 src-tauri/src/character_trainer.rs

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage the Tauri CLI sidecar placeholder
        run: pnpm stage:cli:placeholder

      - name: Rust compile check
        run: cargo check --quiet --message-format=short --manifest-path src-tauri/Cargo.toml

      - name: Character Studio Rust tests
        run: |
          cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib character_trainer
          cargo test --quiet --manifest-path src-tauri/Cargo.toml --lib studio_parity

      - name: Frontend production build
        run: pnpm build

      - name: Parity frontend tests
        run: pnpm vitest run src/lib/chatExportImport.test.ts src/lib/studioParity.test.ts

      - name: Commit validated integration
        run: |
          rm .github/scripts/finalize-portable-character-trainer.py
          rm .github/workflows/finalize-portable-character-trainer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add portable Character Studio training"
          git push origin HEAD:feature/lu-parity-media-imports
