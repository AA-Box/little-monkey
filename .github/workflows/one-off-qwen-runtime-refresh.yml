name: One-off Qwen runtime refresh

on:
  push:
    branches:
      - fix/qwen-image-2-1-runtime-all-platforms
    paths:
      - ".github/workflows/one-off-qwen-runtime-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qwen-image-2-1-runtime-all-platforms
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Align runtime constants and secure Matrix dependency chain
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "src-tauri/build.rs",
              '"sd-master-883-137f740"',
              '"sd-master-890-74988b2"',
          )
          replace(
              ".github/workflows/managed-sd-runtime.yml",
              "sd-master-883-137f740",
              "sd-master-890-74988b2",
          )
          replace(
              "src-tauri/src/managed_runtime.rs",
              '/// Pinned stable-diffusion.cpp release. `master-883-137f740` is the first\n/// upstream release with Qwen-Image 2.1 support. Upstream publishes accelerated\n/// archives for three targets; the release staging path builds the same pinned\n/// commit as a portable CPU runtime for the remaining desktop architectures.\npub const MANAGED_SD_VERSION: &str = "master-883-137f740";',
              '/// Pinned stable-diffusion.cpp release. `master-890-74988b2` is the latest\n/// published release qualified by this tree: it includes Qwen-Image 2.1 plus\n/// the immediate FP8, ggml metadata, VAE retry, reference-image, and generation-\n/// mode fixes that followed the initial support commit.\npub const MANAGED_SD_VERSION: &str = "master-890-74988b2";',
          )
          replace(
              "src-tauri/Cargo.toml",
              '# Held at 0.37 by `matrix-sdk-sqlite`, not by anything in this tree.',
              '# Held at 0.40.2 by `matrix-sdk-sqlite` 0.19.1, not by anything in this tree.',
          )
          replace(
              "src-tauri/Cargo.toml",
              'rusqlite = { version = "0.37", features = ["bundled", "backup", "limits"] }',
              'rusqlite = { version = "0.40.2", features = ["bundled", "backup", "limits"] }',
          )
          replace(
              "src-tauri/Cargo.toml",
              '# Two known costs, both compile-time loud: the SDK\'s `matrix-sdk-sqlite` is\n# what holds `rusqlite` at 0.37 above, and `matrix-sdk-base` pulls `decancer`,',
              '# Two known costs, both compile-time loud: the SDK\'s `matrix-sdk-sqlite` is\n# what holds `rusqlite` at 0.40.2 above, and `matrix-sdk-base` pulls `decancer`,',
          )
          replace(
              "src-tauri/Cargo.toml",
              'matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption", "sqlite"] }',
              'matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "sqlite"] }',
          )

      - name: Resolve the patched dependency graph
        working-directory: src-tauri
        run: cargo update -p matrix-sdk@0.18.0 --precise 0.19.1

      - name: Prove vulnerable sized chunks are gone
        working-directory: src-tauri
        shell: bash
        run: |
          grep -A3 'name = "imbl"' Cargo.lock | head -4
          grep -A3 'name = "imbl-sized-chunks"' Cargo.lock | head -4
          if grep -A3 'name = "imbl-sized-chunks"' Cargo.lock | grep -q 'version = "0.1.3"'; then
            echo "vulnerable imbl-sized-chunks 0.1.3 still resolved" >&2
            exit 1
          fi

      - name: Commit resolved files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/build.rs src-tauri/src/managed_runtime.rs .github/workflows/managed-sd-runtime.yml
          git diff --cached --check
          git commit -m "fix(deps): remove vulnerable imbl-sized-chunks chain"
          git push origin HEAD:fix/qwen-image-2-1-runtime-all-platforms
