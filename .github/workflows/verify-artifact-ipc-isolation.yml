name: Verify Artifact IPC Isolation

# Runs the tier-2 artifact:// sandbox check (src-tauri/examples/verify_artifact_ipc_isolation.rs)
# on real Windows runners. This check's own doc comment explains why it matters
# specifically on Windows: wry's WebView2 backend injects init scripts into every
# subframe regardless of Tauri's for_main_frame_only flag, and Tauri's
# is_local_url treats any registered custom-protocol response as "local" on
# Windows (shared http://<scheme>.localhost address space) — a combination that
# could make the Tauri IPC bridge reachable from inside the sandboxed
# artifact:// iframe. A pass on macOS/Linux does not establish this also passes
# on Windows, so this workflow is the authoritative gate for that platform.
#
# Exit codes from the example: 0 = isolated (PASS), 1 = IPC bridge reachable
# (CONFIRMED VULNERABILITY), 2 = inconclusive/timeout (no verdict reached —
# treated as a failure here too, since it means the check didn't run for real).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/src/artifacts.rs"
      - "src-tauri/examples/verify_artifact_ipc_isolation.rs"
      - "src-tauri/capabilities/**"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src/components/Workspace/ArtifactPane.tsx"
      - ".github/workflows/verify-artifact-ipc-isolation.yml"
  push:
    branches:
      - main
    paths:
      - "src-tauri/src/artifacts.rs"
      - "src-tauri/examples/verify_artifact_ipc_isolation.rs"
      - "src-tauri/capabilities/**"

# The check builds the tree and runs one example binary. It writes nothing
# back to the repository, so the token needs no more than read access.
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Same pin as ci.yml/release.yml (pnpm-workspace.yaml gained the
          # `packages:` field pnpm 9 requires, so the old need to jump to 10
          # here is gone).
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend (generate_context! needs dist/ to exist)
        run: pnpm build

      - name: Stage CLI sidecar placeholder (tauri-build resolves externalBin paths)
        run: pnpm stage:cli:placeholder

      - name: Run artifact IPC isolation check
        run: cargo run --manifest-path src-tauri/Cargo.toml --example verify_artifact_ipc_isolation --target ${{ matrix.target }}
        shell: bash
        env:
          # 60s instead of the 10s default: rule out "cold CI VM's first
          # WebView2 init is just slow" before concluding the runner lacks a
          # usable GUI session entirely.
          VERIFY_ARTIFACT_TIMEOUT_SECS: "60"
          VERIFY_ARTIFACT_DEBUG: "1"
          # Belt-and-braces for virtualized CI VMs with no GPU/ANGLE
          # renderer — the documented WebView2 escape hatch:
          # https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/webview-features-flags
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--disable-gpu"
