name: Bootstrap PR 449 signing fix

on:
  push:
    branches:
      - fix/plugin-ecosystem-e2e
    paths:
      - .github/workflows/fix-pr449-signing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plugin-ecosystem-e2e
          fetch-depth: 0

      - name: Patch Ed25519 PKCS8 compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/bin/monkey-cli/extension_dev_cli.rs')
          text = path.read_text()
          old = 'Ed25519KeyPair::from_pkcs8(&der)'
          new = 'Ed25519KeyPair::from_pkcs8_maybe_unchecked(&der)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one strict PKCS8 parser call, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - name: Verify monkey CLI compiles
        shell: bash
        run: |
          node scripts/ensure-cli-sidecar-placeholder.mjs
          cargo check --manifest-path src-tauri/Cargo.toml --bin monkey-cli --locked

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/bin/monkey-cli/extension_dev_cli.rs
          git commit -m "fix: accept standard Ed25519 PKCS8 signing keys"
          git push origin HEAD:fix/plugin-ecosystem-e2e
