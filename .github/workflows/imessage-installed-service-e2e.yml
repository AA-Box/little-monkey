name: iMessage installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/imessage_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/imessage.rs"
      - "src-tauri/src/imessage_helper/**"
      - "src-tauri/src/bin/monkey-cli/daemon/**"
      - ".github/workflows/imessage-installed-service-e2e.yml"
      - "docs/imessage-installed-service-e2e.md"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imessage-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile real-Messages acceptance harness
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: imessage-installed-service
      - name: Create the build-time CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Compile black-box iMessage harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example imessage_installed_service_e2e
      - name: Explain the real-provider execution boundary
        run: |
          cat <<'EOF'
          The literal acceptance is intentionally run from an interactive shell
          on a Mac signed into the operator's own Messages account. That Mac must
          have the matching little-monkey-imessage-helper with Full Disk Access
          and Messages Automation permission, plus an independent iMessage user
          who sends the pairing/execution markers and copy/pastes the received
          reply. Hosted Actions cannot own those Apple/TCC boundaries or supply
          interactive recipient observation, so CI compiles the exact harness
          but does not mislabel a non-provider run as iMessage E2E evidence.
          EOF
