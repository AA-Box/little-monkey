name: IRC installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/irc_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/irc.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/**"
      - "src-tauri/src/bin/monkey-cli/channels_cli.rs"
      - ".github/workflows/irc-installed-service-e2e.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:
    inputs:
      server:
        description: "Real TLS IRC server to use for the acceptance run"
        required: true
        default: "irc.libera.chat"
        type: string
      port:
        description: "TLS IRC port"
        required: true
        default: "6697"
        type: string

permissions:
  contents: read

concurrency:
  group: irc-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-harness:
    name: compile black-box IRC acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential dbus dbus-user-session dbus-x11 libdbus-1-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: irc-installed-service-compile

      - name: Stage CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs

      - name: Compile the external acceptance harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example irc_installed_service_e2e

  live-installed-service:
    name: real IRC -> installed daemon -> agent -> real IRC
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      LITTLE_MONKEY_REQUIRE_IRC_INSTALLED_SERVICE_E2E: "1"
      IRC_E2E_SERVER: ${{ inputs.server }}
      IRC_E2E_PORT: ${{ inputs.port }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native service dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential dbus dbus-user-session dbus-x11 libdbus-1-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: irc-installed-service-live

      - name: Build and pin the production CLI
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml -p little-monkey
          node scripts/ensure-cli-sidecar-placeholder.mjs
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin monkey-cli
          node scripts/ensure-cli-sidecar-placeholder.mjs

      # Use PID 1's real user manager, exactly like the native secure-store
      # acceptance. A nested systemd instance cannot own a cgroup inside the
      # hosted runner's service.
      - name: Start real systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          runtime="/run/user/$uid"

          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"

          ready=0
          for _ in $(seq 1 60); do
            if [ -S "$runtime/bus" ]; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            sudo systemctl --no-pager --full status "user@${uid}.service" || true
            exit 1
          fi

          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          systemctl --user import-environment HOME PATH XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS

      - name: Run the literal installed-service IRC acceptance
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path src-tauri/Cargo.toml \
            --example irc_installed_service_e2e -- \
            "$IRC_E2E_SERVER" "$IRC_E2E_PORT"

      - name: Dump systemd diagnostics on failure
        if: failure()
        shell: bash
        run: |
          systemctl --user --no-pager --full status || true
          systemctl --user --no-pager --full list-units 'little-monkey-daemon*' || true
          sudo systemctl --no-pager --full status "user@$(id -u).service" || true
