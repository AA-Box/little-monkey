name: Standards Studio E2E

on:
  pull_request:
    paths:
      - "src/lib/standards.ts"
      - "src/lib/standardsRepository.ts"
      - "src/lib/standardsDiscovery.ts"
      - "src/lib/standards*.test.ts"
      - "src-tauri/src/bin/monkey-cli/main.rs"
      - "src-tauri/src/bin/monkey-cli/standards_cli.rs"
      - "docs/standards-studio.md"
      - ".github/workflows/standards-e2e.yml"
  push:
    branches:
      - fix/standards-5of5-cli-evals
    paths:
      - "src/lib/standards.ts"
      - "src/lib/standardsRepository.ts"
      - "src/lib/standardsDiscovery.ts"
      - "src/lib/standards*.test.ts"
      - "src-tauri/src/bin/monkey-cli/main.rs"
      - "src-tauri/src/bin/monkey-cli/standards_cli.rs"
      - ".github/workflows/standards-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux/Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Standards lifecycle and discovery fixtures
        run: pnpm vitest run src/lib/standards.test.ts src/lib/standardsDiscovery.test.ts

      - name: Stage CLI sidecar placeholder
        run: pnpm stage:cli:placeholder

      - name: Compile real monkey standards CLI surface
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin monkey-cli

      - name: Run standards CLI unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin monkey-cli standards_cli

      - name: Exercise real monkey standards lifecycle
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin monkey-cli
          BIN="src-tauri/target/debug/monkey-cli"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/src/components" "$TMP/docs"
          cat > "$TMP/tsconfig.json" <<'JSON'
          {"compilerOptions":{"strict":true,"paths":{"@/*":["src/*"]}}}
          JSON
          cat > "$TMP/.editorconfig" <<'EOF'
          root = true
          [*]
          indent_style = space
          EOF
          for name in UserCard AdminCard RoleCard; do
            printf "export const %s = () => null;\n" "$name" > "$TMP/src/components/$name.tsx"
          done
          printf '# Fixture\n' > "$TMP/README.md"
          printf '# Architecture\n' > "$TMP/docs/architecture.md"
          printf '# Security\n' > "$TMP/docs/security.md"

          "$BIN" --workspace "$TMP" standards discover --json > "$TMP/discovered.json"
          python3 - "$TMP/discovered.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          ids = {item["standard_id"] for item in data}
          required = {"compiler-typescript", "editorconfig-style", "architecture-layer-components"}
          missing = required - ids
          if missing:
              raise SystemExit(f"missing discovered standards: {sorted(missing)}")
          PY

          ID="compiler-typescript"
          "$BIN" --workspace "$TMP" standards show "$ID" --json > /dev/null
          "$BIN" --workspace "$TMP" standards approve "$ID" --json > /dev/null
          "$BIN" --workspace "$TMP" standards preview "Refactor this TypeScript module" --file src/components/UserCard.tsx --json > "$TMP/preview.json"
          python3 - "$TMP/preview.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          if not any(item["standard_id"] == "compiler-typescript" for item in data["selected"]):
              raise SystemExit("approved compiler standard was not selected")
          PY
          "$BIN" --workspace "$TMP" standards conflicts --json > /dev/null
          "$BIN" --workspace "$TMP" standards drift --json > /dev/null
          "$BIN" --workspace "$TMP" standards export .little-monkey/standards/roundtrip.json --json > /dev/null
          "$BIN" --workspace "$TMP" standards import .little-monkey/standards/roundtrip.json --json > /dev/null
          "$BIN" --workspace "$TMP" standards list --json > /dev/null
