name: Voice Everywhere Stage10 Snapshot

on:
  push:
    branches:
      - feat/voice-everywhere-stage10

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voice-everywhere
      - uses: actions/upload-artifact@v4
        with:
          name: voice-everywhere-stage10-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
