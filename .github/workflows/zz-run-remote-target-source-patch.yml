name: Run remote target source patch

on:
  push:
    branches: [fix/remote-execution-e2e-ssh-remotenode]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[remote-target-patched]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remote-execution-e2e-ssh-remotenode
          fetch-depth: 0
      - name: Apply existing guarded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/zz-apply-remote-target-source.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          Path('/tmp/remote-target-patch.py').write_text(textwrap.dedent(source[start:end]))
          PY
          python3 /tmp/remote-target-patch.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/execution_target.rs \
                  src-tauri/src/execution_target/remote_node.rs \
                  src-tauri/src/daemon_commands.rs \
                  src-tauri/tests/execution_target_ssh_e2e.rs \
                  src/lib/autonomousTaskRunner.ts
          git commit -m "feat(remote): route K17 nodes through ExecutionTarget [remote-target-patched]"
          git push origin HEAD:fix/remote-execution-e2e-ssh-remotenode
