name: SMS installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/sms_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/telecom_cli.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/sms.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/telecom_worker.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/telephony/**"
      - "src-tauri/src/bin/monkey-cli/daemon/channel_worker.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/webhook.rs"
      - ".github/workflows/sms-installed-service-e2e.yml"
      - "docs/sms-installed-service-e2e.md"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile real-carrier SMS acceptance harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libdbus-1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: sms-installed-service
      - name: Create the build-time CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Prove one switch controls the SMS shadow channel
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin monkey-cli sms_shadow_enablement_follows_the_number -- --nocapture
      - name: Compile black-box SMS harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example sms_installed_service_e2e
      - name: Explain live-provider boundary
        run: |
          cat <<'EOF'
          Hosted PR CI compiles the real-carrier harness and proves the public
          telecom enable/disable switch keeps the internal SMS channel in lockstep.
          Literal SMS acceptance is intentionally run with an operator-owned
          Twilio, Telnyx or Plivo account and a separate real handset. The carrier
          must deliver its own signed webhook and delivery receipt; the harness
          never fabricates either. Final recipient observation is proved by
          sending the exact hidden-nonce reply back from the handset through the
          carrier.
          EOF
