name: Tree-sitter Cargo lockfile reconciliation
on:
  push:
    branches: [feature/agent-context-exposure-20261018]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lockfile-canonical-diff:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Generate canonical lockfile with Cargo
        run: |
          cd src-tauri
          cargo metadata --format-version 1 > /dev/null
          echo "=== BEGIN EXPECTED CARGO.LOCK DIFF ==="
          git diff -- Cargo.lock
          echo "=== END EXPECTED CARGO.LOCK DIFF ==="
          if ! git diff --quiet -- Cargo.lock; then
            echo "::error::Cargo.lock differs from Cargo's canonical dependency resolution; commit corrected Cargo.lock"
            exit 1
          fi
  cross-platform-locked-resolution:
    needs: lockfile-canonical-diff
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Rust dependency resolution cannot change Cargo.lock
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps
