name: Voice Everywhere verification

on:
  push:
    branches:
      - feat/voice-everywhere

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and focused voice tests
        shell: bash
        run: |
          set +e
          mkdir -p voice-everywhere-logs
          pnpm typecheck >voice-everywhere-logs/frontend.log 2>&1
          typecheck_status=$?
          pnpm vitest run src/lib/talkEngine.test.ts src/lib/mobileTalkProtocol.test.ts >>voice-everywhere-logs/frontend.log 2>&1
          test_status=$?
          echo "typecheck_status=$typecheck_status" >>voice-everywhere-logs/frontend.log
          echo "test_status=$test_status" >>voice-everywhere-logs/frontend.log
          if [ "$typecheck_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then exit 1; fi
      - name: Upload frontend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-everywhere-frontend-log
          path: voice-everywhere-logs/frontend.log
          retention-days: 1

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Create Tauri sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Compile and focused remote voice tests
        shell: bash
        run: |
          set +e
          mkdir -p voice-everywhere-logs
          cargo test --manifest-path src-tauri/Cargo.toml --bin monkey-cli voice_route -- --nocapture >voice-everywhere-logs/rust.log 2>&1
          voice_status=$?
          cargo test --manifest-path src-tauri/Cargo.toml --bin monkey-cli talk -- --nocapture >>voice-everywhere-logs/rust.log 2>&1
          talk_status=$?
          echo "voice_status=$voice_status" >>voice-everywhere-logs/rust.log
          echo "talk_status=$talk_status" >>voice-everywhere-logs/rust.log
          if [ "$voice_status" -ne 0 ] || [ "$talk_status" -ne 0 ]; then exit 1; fi
      - name: Upload Rust log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-everywhere-rust-log
          path: voice-everywhere-logs/rust.log
          retention-days: 1
