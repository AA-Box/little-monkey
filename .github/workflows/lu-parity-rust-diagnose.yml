name: LU parity validation

on:
  push:
    branches:
      - feature/lu-parity-media-imports
    paths:
      - .github/workflows/lu-parity-rust-diagnose.yml

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lu-parity-media-imports
          fetch-depth: 0

      - name: Prepare implementation
        run: |
          git fetch origin develop
          python3 .github/scripts/lu-parity-prepare.py
          rustfmt --edition 2021 src-tauri/src/studio_parity.rs

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage validation-only CLI sidecar
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/monkey-cli-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/monkey-cli-x86_64-unknown-linux-gnu

      - name: Rust check
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo check --quiet --message-format=short --manifest-path src-tauri/Cargo.toml

      - name: Studio Rust tests
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --quiet --manifest-path src-tauri/Cargo.toml studio_parity --lib

      - name: Frontend build
        run: pnpm build

      - name: Targeted frontend tests
        run: pnpm vitest run src/lib/chatExportImport.test.ts src/lib/studioParity.test.ts

      - name: Commit validated implementation
        run: |
          rm -f src-tauri/binaries/monkey-cli-x86_64-unknown-linux-gnu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset .github/workflows/lu-parity-rust-diagnose.yml .github/scripts/lu-parity-prepare.py
          git commit -m "fix: harden and validate creator parity workflows"
          git push origin HEAD:feature/lu-parity-media-imports
