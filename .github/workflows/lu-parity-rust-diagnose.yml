name: LU parity Rust diagnostics

on:
  push:
    branches: [feature/lu-parity-media-imports]
    paths:
      - .github/workflows/lu-parity-rust-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lu-parity-media-imports
          fetch-depth: 0
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Capture cargo check
        run: |
          set +e
          CARGO_PROFILE_DEV_DEBUG=0 cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee .ci-rust-check.log
          status=${PIPESTATUS[0]}
          printf '\nCARGO_CHECK_EXIT=%s\n' "$status" >> .ci-rust-check.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .ci-rust-check.log
          git commit -m "chore: capture creator parity Rust diagnostics"
          git push origin HEAD:feature/lu-parity-media-imports
