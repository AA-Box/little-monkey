name: LU parity Rust diagnostics

on:
  push:
    branches: [feature/lu-parity-media-imports]
    paths:
      - .github/workflows/lu-parity-rust-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lu-parity-media-imports
          fetch-depth: 0
      - name: Extract existing cargo diagnostics
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('.ci-rust-check.log').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          lines = text.splitlines()
          keep = []
          for i, line in enumerate(lines):
              if ('error[' in line or 'error:' in line or 'could not compile' in line or 'CARGO_CHECK_EXIT=' in line):
                  lo = max(0, i - 2)
                  hi = min(len(lines), i + 5)
                  keep.extend(lines[lo:hi])
          compact = []
          for line in keep:
              if not compact or compact[-1] != line:
                  compact.append(line)
          Path('.ci-rust-errors.log').write_text('\n'.join(compact[-300:]) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .ci-rust-errors.log
          git commit -m "chore: extract Rust compiler diagnostics"
          git push origin HEAD:feature/lu-parity-media-imports
