name: Apply channel secure-storage fix

on:
  push:
    branches:
      - fix/channel-secret-daemon-ownership

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted cross-platform fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path("src-tauri/src/bin/monkey-cli/daemon/service.rs")
          service = service_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Repair the accidentally dropped normal-UTF8 arm from the previous
          # partial commit before doing anything else. This makes ordinary
          # command output decoding total again.
          service = replace_once(
              service,
              """    } else if bytes.len() >= 2 && bytes[1] == 0 {
                  (bytes, Some(false))
              };
          """,
              """    } else if bytes.len() >= 2 && bytes[1] == 0 {
                  (bytes, Some(false))
              } else {
                  (bytes, None)
              };
          """,
              "restore UTF-8 command output arm",
          )

          # Linux user services should not depend on whatever environment the
          # desktop happened to import into systemd. Give Secret Service the
          # canonical user bus address and give every secure-store backend a
          # concrete HOME. %t is expanded by systemd for the user manager.
          service = replace_once(
              service,
              r"[Service]\nType=simple\nEnvironment={}\nExecStart={} --profile={} daemon serve\n",
              r"[Service]\nType=simple\nEnvironment={}\nEnvironment={}\nEnvironment=\"XDG_RUNTIME_DIR=%t\"\nEnvironment=\"DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus\"\nExecStart={} --profile={} daemon serve\n",
              "systemd secure-store environment",
          )
          service = replace_once(
              service,
              '''                systemd_environment_escape(&format!("LITTLE_MONKEY_HOME={agent_home}")),
                          systemd_escape(&executable),
          ''',
              '''                systemd_environment_escape(&format!("LITTLE_MONKEY_HOME={agent_home}")),
                          systemd_environment_escape(&format!("HOME={user_home}")),
                          systemd_escape(&executable),
          ''',
              "systemd HOME argument",
          )

          # A Scheduled Task already runs with InteractiveToken. Make the user
          # profile explicit too, so native Credential Manager access and any
          # profile-based helper code see the same identity/context as the GUI.
          service = replace_once(
              service,
              '''                    "$env:LITTLE_MONKEY_HOME={}; & {} --profile {} daemon serve; exit $LASTEXITCODE",
                              powershell_single_quote(&agent_home),
                              powershell_single_quote(&executable),
                              powershell_single_quote(&self.profile_id),
          ''',
              '''                    "$env:USERPROFILE={}; $env:HOME={}; $env:LITTLE_MONKEY_HOME={}; & {} --profile {} daemon serve; exit $LASTEXITCODE",
                              powershell_single_quote(user_home),
                              powershell_single_quote(user_home),
                              powershell_single_quote(&agent_home),
                              powershell_single_quote(&executable),
                              powershell_single_quote(&self.profile_id),
          ''',
              "Windows user profile environment",
          )

          service = replace_once(
              service,
              '''            if platform == ServicePlatform::Launchd {
                          assert!(rendered.contains("<key>HOME</key><string>/home/test</string>"));
                          assert!(rendered.contains(
                              "<key>WorkingDirectory</key><string>/home/test</string>"
                          ));
                      }
          ''',
              '''            match platform {
                          ServicePlatform::Launchd => {
                              assert!(rendered.contains("<key>HOME</key><string>/home/test</string>"));
                              assert!(rendered.contains(
                                  "<key>WorkingDirectory</key><string>/home/test</string>"
                              ));
                          }
                          ServicePlatform::SystemdUser => {
                              assert!(rendered.contains(r#"Environment=\"HOME=/home/test\""#));
                              assert!(rendered.contains(r#"Environment=\"XDG_RUNTIME_DIR=%t\""#));
                              assert!(rendered.contains(
                                  r#"Environment=\"DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus\""#
                              ));
                              assert!(rendered.contains(r#"WorkingDirectory=\"/home/test\""#));
                          }
                          ServicePlatform::WindowsTask => {
                              assert!(command.contains("$env:USERPROFILE='/home/test'"));
                              assert!(command.contains("$env:HOME='/home/test'"));
                              assert!(rendered.contains("<LogonType>InteractiveToken</LogonType>"));
                          }
                      }
          ''',
              "cross-platform service manifest assertions",
          )

          service_path.write_text(service)

          cargo_path = Path("src-tauri/Cargo.toml")
          cargo = cargo_path.read_text()
          cargo = replace_once(
              cargo,
              'keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }',
              'keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }',
              "Linux keyring backend",
          )
          cargo = cargo.replace(
              "# credential — keys \"save\" but can never be read back (has_key stays false).\nkeyring =",
              "# credential — keys \"save\" but can never be read back (has_key stays false).\n# Linux uses keyutils + Secret Service together: persistent desktop storage when\n# available, with a native kernel-backed store for headless/user-service contexts.\nkeyring =",
              1,
          )
          cargo_path.write_text(cargo)
          PY

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: channel-secure-storage-fix

      - name: Stage required CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs

      - name: Format and verify source
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          git diff --check

      - name: Compile daemon and native keyring path on Linux
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin monkey-cli

      - name: Run service-manifest regression test
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --bin monkey-cli
          daemon::service::tests::manifests_quote_executable_and_use_explicit_daemon_serve
          -- --exact --nocapture

      - name: Commit verified fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/channel-secret-fix.yml
          git add src-tauri/src/bin/monkey-cli/daemon/service.rs src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --check
          echo "Committed paths:"
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(channels): harden daemon secure storage across platforms"
          git push origin "HEAD:${GITHUB_REF_NAME}"
