name: PR 452 Windows Tokio check

on:
  push:
    branches:
      - fix/zero-config-whisper
    paths:
      - .github/workflows/pr452-windows-tokio-check.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-config-whisper
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: windows-latest

      - name: Stage CLI sidecar placeholder
        shell: pwsh
        run: node scripts/ensure-cli-sidecar-placeholder.mjs

      - name: Restore develop Tokio runtime
        shell: pwsh
        run: |
          cargo update --manifest-path src-tauri/Cargo.toml -p tokio --precise 1.52.3
          cargo update --manifest-path src-tauri/Cargo.toml -p tokio-macros --precise 2.7.0
          cargo tree --manifest-path src-tauri/Cargo.toml -p tokio

      - name: Prove the Windows long-running fixture itself
        shell: pwsh
        run: |
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          cmd /C "ping -n 3 127.0.0.1 > nul"
          $code = $LASTEXITCODE
          $watch.Stop()
          Write-Host "cmd/ping exit=$code elapsedMs=$($watch.ElapsedMilliseconds)"
          if ($code -ne 0) { throw "cmd/ping fixture failed with $code" }
          if ($watch.ElapsedMilliseconds -lt 1500) { throw "cmd/ping fixture exited too quickly: $($watch.ElapsedMilliseconds)ms" }

      - name: Instrument timeout result without changing the commit
        shell: python
        run: |
          from pathlib import Path
          p = Path("src-tauri/src/verify.rs")
          s = p.read_text()
          start = "async fn run_command_impl_times_out_a_long_running_command() {"
          end = "\n    /// A verify command's whole process-table lifecycle"
          before, rest = s.split(start, 1)
          body, after = rest.split(end, 1)
          old = "        assert!(result.timed_out);"
          if body.count(old) != 1:
              raise SystemExit(f"expected one timeout assertion in scoped test, found {body.count(old)}")
          body = body.replace(old, '        assert!(result.timed_out, "{result:?}");', 1)
          p.write_text(before + start + body + end + after)

      - name: Verify Windows timeout
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib verify::tests::run_command_impl_times_out_a_long_running_command -- --exact --nocapture --test-threads=1

      - name: Verify Windows typed wall breach
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib verify::tests::a_verify_command_stopped_by_a_limit_persists_the_typed_breach -- --exact --nocapture --test-threads=1

      - name: Verify Windows cancellation row
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib verify::tests::a_cancelled_verify_command_closes_as_cancelled_and_not_as_a_limit -- --exact --nocapture --test-threads=1

      - name: Verify Windows cancellation result
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib verify::tests::run_command_impl_is_killed_by_tool_cancel_notify -- --exact --nocapture --test-threads=1

      - name: Verify learning whole loop
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib skill_learning::tests::the_whole_loop_runs_end_to_end_across_a_restart -- --exact --nocapture --test-threads=1

      - name: Commit proven lock correction and remove one-shot workflow
        shell: pwsh
        run: |
          git restore src-tauri/src/verify.rs
          Remove-Item .github/workflows/pr452-windows-tokio-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/pr452-windows-tokio-check.yml
          git diff --cached --check
          git commit -m "fix: keep Tokio runtime at proven Windows version"
          git push origin HEAD:fix/zero-config-whisper
