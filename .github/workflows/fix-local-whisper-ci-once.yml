name: Apply local Whisper CI fixes once

on:
  push:
    branches:
      - fix/zero-config-whisper
    paths:
      - '.github/workflows/fix-local-whisper-ci-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zero-config-whisper
          fetch-depth: 0
      - name: Apply compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s) of {old!r}, found {actual}")
              p.write_text(text.replace(old, new, count))

          replace_exact(
              "src-tauri/src/local_whisper.rs",
              "use symphonia::core::audio::Audio;\n",
              "",
          )
          replace_exact(
              "src-tauri/src/local_whisper.rs",
              "let rate = audio.spec().rate;",
              "let rate = audio.spec().rate();",
          )
          replace_exact(
              "src-tauri/src/local_whisper.rs",
              "let channels = audio.spec().channels.count();",
              "let channels = audio.spec().channels().count();",
          )
          replace_exact(
              "src-tauri/src/local_whisper.rs",
              "params.set_abort_callback_safe(Some(move || cancel_for_callback.is_cancelled()));",
              "params.set_abort_callback_safe(move || cancel_for_callback.is_cancelled());",
          )
          replace_exact(
              "src-tauri/src/m7_companion.rs",
              "async fn transcribe_path(\n    state: &M7CompanionState,\n    job_id: &str,",
              "async fn transcribe_path(\n    state: &M7CompanionState,\n    _job_id: &str,",
          )

          cargo_config = Path(".cargo/config.toml")
          if not cargo_config.exists():
              raise SystemExit("expected .cargo/config.toml to exist")
          cargo_config.unlink()
          PY
          git status --short
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(talk): make built-in Whisper compile cross-platform"
          git push origin HEAD:fix/zero-config-whisper
