name: Teams installed-service E2E

on:
  pull_request:
    paths:
      - "src-tauri/examples/teams_installed_service_e2e.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/adapters/teams.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/webhook.rs"
      - "src-tauri/src/bin/monkey-cli/daemon/**"
      - "src-tauri/src/bin/monkey-cli/channels_cli.rs"
      - ".github/workflows/teams-installed-service-e2e.yml"
      - "docs/teams-installed-service-e2e.md"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teams-installed-service-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile real-account acceptance harness
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential libdbus-1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: teams-installed-service
      - name: Create the build-time CLI sidecar placeholder
        run: node scripts/ensure-cli-sidecar-placeholder.mjs
      - name: Compile black-box Teams harness
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --example teams_installed_service_e2e
      - name: Explain live-provider boundary
        run: |
          cat <<'EOF'
          Hosted PR CI compiles but does not execute the live Teams acceptance.
          A literal run needs a real Azure Bot / Teams app, a public HTTPS messaging
          endpoint routed to the installed daemon, and an independent Teams user.
          The inbound activity must carry Microsoft's real Bot Framework JWT and the
          independent Teams client must observe the exact generated reply. A locally
          fabricated Activity or a successful Connector API response is not accepted
          as end-to-end evidence.
          EOF
